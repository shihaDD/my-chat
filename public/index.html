<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мессенджер и Лента</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #0e0e0e; color: #fff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        /* Авторизация */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background: #181818; }
        #auth-screen input, #auth-screen button { margin: 8px; padding: 12px; width: 280px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
        #auth-screen button { background: #ff0050; border: none; cursor: pointer; font-weight: bold; }

        /* Основной интерфейс */
        #app-screen { display: none; height: 100vh; flex-direction: row; }
        .sidebar { width: 320px; background: #121212; border-right: 1px solid #222; display: flex; flex-direction: column; }
        .tabs { display: flex; background: #1a1a1a; border-bottom: 1px solid #222; }
        .tab-btn { flex: 1; padding: 12px; background: none; border: none; color: #888; cursor: pointer; font-size: 13px; font-weight: bold; }
        .tab-btn.active { color: #ff0050; border-bottom: 2px solid #ff0050; }
        
        .tab-content { flex: 1; overflow-y: auto; padding: 10px; }
        .hidden { display: none !important; }

        /* Контент чатов и друзей */
        .user-item { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 6px; cursor: pointer; margin-bottom: 4px; background: #1a1a1a; }
        .user-item:hover { background: #252525; }
        .action-btns button { padding: 4px 8px; margin-left: 4px; border: none; border-radius: 4px; cursor: pointer; background: #333; color: #fff; font-size: 11px; }
        .action-btns button.call-btn { background: #00b894; }

        /* Область чата / звонка */
        .main-chat { flex: 1; display: flex; flex-direction: column; background: #161616; position: relative; }
        .chat-header { padding: 15px; background: #1a1a1a; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .messages-area { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .message { padding: 10px 14px; border-radius: 8px; max-width: 60%; word-break: break-word; background: #262626; }
        .message.my { align-self: flex-end; background: #ff0050; }
        .chat-input-area { padding: 15px; background: #1a1a1a; display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; padding: 10px; border-radius: 6px; border: 1px solid #333; background: #222; color: #fff; }
        .chat-input-area button { padding: 10px 20px; background: #ff0050; border: none; border-radius: 6px; color: #fff; cursor: pointer; }

        /* Модалка звонка */
        #call-modal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .call-btn-hang { background: #ff0050 !important; padding: 12px 24px; border-radius: 30px; border: none; color: #fff; font-weight: bold; cursor: pointer; margin-top: 20px; }

        /* Лента TikTok (бесконечная) */
        #tiktok-feed { flex: 1; overflow-y: scroll; height: 100vh; scroll-snap-type: y mandatory; background: #000; }
        .tiktok-card { height: 100vh; scroll-snap-align: start; display: flex; align-items: center; justify-content: center; font-size: 28px; border-bottom: 2px solid #222; position: relative; background: #111; }
        .tiktok-card .info { position: absolute; bottom: 40px; left: 20px; }

        /* Настройки */
        .settings-pane { padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .settings-pane label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: #aaa; }
        .settings-pane select, .settings-pane input { padding: 8px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
    </style>
</head>
<body>

    <!-- Экран авторизации -->
    <div id="auth-screen">
        <h2>Вход / Регистрация</h2>
        <input type="text" id="login-input" placeholder="Логин">
        <input type="password" id="pass-input" placeholder="Пароль">
        <button onclick="loginUser()">Войти</button>
        <button onclick="registerUser()" style="background:#333;">Зарегистрироваться</button>
    </div>

    <!-- Основной интерфейс -->
    <div id="app-screen">
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('chats', this)">Чаты</button>
                <button class="tab-btn" onclick="switchTab('friends', this)">Друзья</button>
                <button class="tab-btn" onclick="switchTab('feed', this)">Лента</button>
                <button class="tab-btn" onclick="switchTab('settings', this)">Настройки</button>
            </div>
            
            <div id="tab-chats" class="tab-content">
                <div id="chats-list"></div>
            </div>
            
            <div id="tab-friends" class="tab-content hidden">
                <div style="margin-bottom: 10px;">
                    <input type="text" id="add-friend-input" placeholder="Логин друга" style="width: 70%; padding: 6px; background:#222; border:1px solid #444; color:#fff; border-radius:4px;">
                    <button onclick="addFriend()" style="padding: 6px 10px; background:#ff0050; border:none; color:#fff; border-radius:4px; cursor:pointer;">Добавить</button>
                </div>
                <h3>Список друзей</h3>
                <div id="friends-list" style="margin-top: 10px;"></div>
                <h3 style="margin-top: 15px;">Заявки</h3>
                <div id="requests-list" style="margin-top: 10px;"></div>
            </div>

            <div id="tab-settings" class="tab-content hidden settings-pane">
                <h3>Настройки управления</h3>
                <label>Клавиша микрофона (Мьюту):
                    <input type="text" id="setting-key-mute" value="M" onchange="saveSettings()">
                </label>
                <label>Клавиша вызова:
                    <input type="text" id="setting-key-call" value="Enter" onchange="saveSettings()">
                </label>
                <label>Устройство ввода (Мышь):
                    <select id="setting-mouse" onchange="saveSettings()">
                        <option value="Стандартная мышь">Стандартная мышь</option>
                        <option value="Игровая мышь (с боковыми кнопками)">Игровая мышь (с боковыми кнопками)</option>
                        <option value="Трекпад / Прочее">Трекпад / Прочее</option>
                    </select>
                </label>
            </div>
        </div>

        <!-- Центральная область (Чат или Лента) -->
        <div class="main-chat" id="main-content-area">
            <div id="chat-view" style="display: flex; flex-direction: column; height: 100%;">
                <div class="chat-header">
                    <span id="active-chat-title">Выберите чат</span>
                    <button id="call-tooltip-btn" onclick="startCall()" style="background:#00b894; border:none; padding:8px 14px; border-radius:6px; color:#fff; cursor:pointer;">Позвонить</button>
                </div>
                <div class="messages-area" id="messages-container"></div>
                <div class="chat-input-area">
                    <input type="text" id="message-text" placeholder="Введите сообщение...">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>

            <!-- Бесконечная лента TikTok -->
            <div id="feed-view" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div id="tiktok-feed">
                    <div class="tiktok-card">Видео #1<div class="info">Автор: @user1</div></div>
                    <div class="tiktok-card">Видео #2<div class="info">Автор: @user2</div></div>
                    <div class="tiktok-card">Видео #3<div class="info">Автор: @user3</div></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Модалка активного звонка -->
    <div id="call-modal" class="hidden">
        <h2 id="call-status-text">ЗВОНОК АКТИВЕН</h2>
        <p id="mic-status-label" style="color: #ff0050; margin: 10px 0;">МИКРОФОН ВКЛЮЧЕН</p>
        <button class="call-btn-hang" onclick="hangUp()">ЗАВЕРШИТЬ ЗВОНОК</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentDB = null;
        let activeChatUser = null;
        let isMicMuted = false;
        let peerConnection = null;

        const iceServers = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
            
            if(tabName === 'feed') {
                document.getElementById('chat-view').classList.add('hidden');
                document.getElementById('feed-view').classList.remove('hidden');
            } else {
                document.getElementById('feed-view').classList.add('hidden');
                document.getElementById('chat-view').classList.remove('hidden');
                document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            }
            btn.classList.add('active');
        }

        async function loginUser() {
            const login = document.getElementById('login-input').value.trim();
            const password = document.getElementById('pass-input').value.trim();
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            }).then(r => r.json());

            if (res.success) {
                currentUser = res.user;
                currentDB = res.db;
                initApp();
            } else {
                alert(res.error);
            }
        }

        async function registerUser() {
            const login = document.getElementById('login-input').value.trim();
            const password = document.getElementById('pass-input').value.trim();
            const res = await fetch('/api/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, name: login, password })
            }).then(r => r.json());

            if (res.success) {
                currentUser = res.user;
                currentDB = res.db;
                initApp();
            } else {
                alert(res.error);
            }
        }

        function initApp() {
            document.getElementById('auth-screen').style.display = 'none';
            document.getElementById('app-screen').style.display = 'flex';
            socket.emit('register', currentUser.login);
            loadSettingsToUI();
            renderUI();
        }

        function loadSettingsToUI() {
            const settings = currentDB.settings?.[currentUser.login] || { keybinds: { mute: 'M', call: 'Enter' }, mouseDevice: 'Стандартная мышь' };
            document.getElementById('setting-key-mute').value = settings.keybinds?.mute || 'M';
            document.getElementById('setting-key-call').value = settings.keybinds?.call || 'Enter';
            document.getElementById('setting-mouse').value = settings.mouseDevice || 'Стандартная мышь';
            updateDynamicTooltips();
        }

        function updateDynamicTooltips() {
            const muteKey = document.getElementById('setting-key-mute').value;
            const callKey = document.getElementById('setting-key-call').value;
            const callBtn = document.getElementById('call-tooltip-btn');
            if(callBtn) callBtn.innerText = `Позвонить (${callKey})`;
        }

        async function saveSettings() {
            const keybinds = {
                mute: document.getElementById('setting-key-mute').value,
                call: document.getElementById('setting-key-call').value
            };
            const mouseDevice = document.getElementById('setting-mouse').value;

            updateDynamicTooltips();

            await fetch('/api/update-settings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: currentUser.login, keybinds, mouseDevice })
            });
        }

        async function refreshData() {
            const res = await fetch('/api/data').then(r => r.json());
            currentDB = res;
            renderUI();
        }

        function renderUI() {
            renderChats();
            renderFriends();
        }

        function renderChats() {
            const list = document.getElementById('chats-list');
            list.innerHTML = '';
            const friends = currentDB.friends[currentUser.login] || [];
            
            friends.forEach(fLogin => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<span>${fLogin}</span>`;
                div.onclick = () => openChat(fLogin);
                list.appendChild(div);
            });
        }

        function renderFriends() {
            const fList = document.getElementById('friends-list');
            fList.innerHTML = '';
            const friends = currentDB.friends[currentUser.login] || [];
            
            friends.forEach(f => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `
                    <span>${f}</span>
                    <div class="action-btns">
                        <button class="call-btn" onclick="openChat('${f}'); startCall();">Звонок</button>
                        <button onclick="openChat('${f}')">Чат</button>
                    </div>
                `;
                fList.appendChild(div);
            });

            const rList = document.getElementById('requests-list');
            rList.innerHTML = '';
            const requests = currentDB.friendRequests[currentUser.login] || [];
            requests.forEach(reqLogin => {
                const div = document.createElement('div');
                div.className = 'user-item';
                div.innerHTML = `<span>${reqLogin}</span><button onclick="respondRequest('${reqLogin}', true)">Принять</button>`;
                rList.appendChild(div);
            });
        }

        async function addFriend() {
            const targetLogin = document.getElementById('add-friend-input').value.trim();
            const res = await fetch('/api/add-friend', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: currentUser.login, targetLogin })
            }).then(r => r.json());
            if(res.success) { alert('Заявка отправлена!'); refreshData(); } else { alert(res.error); }
        }

        async function respondRequest(requesterLogin, accept) {
            await fetch('/api/respond-friend-request', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login: currentUser.login, requesterLogin, accept })
            });
            refreshData();
        }

        function openChat(login) {
            activeChatUser = login;
            document.getElementById('active-chat-title').innerText = login;
            renderMessages();
        }

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            if(!activeChatUser) return;
            
            const msgs = currentDB.messagesStore?.[currentUser.login]?.[activeChatUser] || [];
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.sender === currentUser.login ? 'my' : ''}`;
                div.innerText = `${m.text} (${m.time})`;
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const textInput = document.getElementById('message-text');
            const text = textInput.value.trim();
            if(!text || !activeChatUser) return;

            await fetch('/api/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender: currentUser.login, receiver: activeChatUser, text })
            });
            textInput.value = '';
            refreshData();
            setTimeout(renderMessages, 100);
        }

        // Логика звонков WebRTC
        async function startCall() {
            if(!activeChatUser) return alert.error || alert('Выберите чат для звонка');
            document.getElementById('call-modal').classList.remove('hidden');
            
            peerConnection = new RTCPeerConnection(iceServers);
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

            peerConnection.onicecandidate = e => {
                if (e.candidate) socket.emit('ice-candidate', { to: activeChatUser, candidate: e.candidate });
            };

            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('call-user', { to: activeChatUser, offer, from: currentUser.login });
        }

        socket.on('incoming-call', async ({ from, offer }) => {
            activeChatUser = from;
            document.getElementById('call-modal').classList.remove('hidden');
            
            peerConnection = new RTCPeerConnection(iceServers);
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));

            peerConnection.onicecandidate = e => {
                if (e.candidate) socket.emit('ice-candidate', { to: from, candidate: e.candidate });
            };

            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('call-accepted', { to: from, answer });
        });

        socket.on('call-answered', async ({ answer }) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        });

        socket.on('ice-candidate', async ({ candidate }) => {
            if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        });

        socket.on('hang-up', () => { hangUp(true); });

        function hangUp(remote = false) {
            if(!remote && activeChatUser) {
                socket.emit('hang-up', { to: activeChatUser });
            }
            if(peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            document.getElementById('call-modal').classList.add('hidden');
        }

        // Управление с клавиатуры с учетом актуальных клавиш
        window.addEventListener('keydown', (e) => {
            const muteKey = document.getElementById('setting-key-mute').value.toLowerCase();
            const callKey = document.getElementById('setting-key-call').value.toLowerCase();
            
            if(e.key.toLowerCase() === muteKey) {
                isMicMuted = !isMicMuted;
                const micLbl = document.getElementById('mic-status-label');
                if(micLbl) {
                    micLbl.innerText = isMicMuted ? 'МИКРОФОН ВЫКЛЮЧЕН' : 'МИКРОФОН ВКЛЮЧЕН';
                    micLbl.style.color = isMicMuted ? '#888' : '#ff0050';
                }
            }
            if(e.key.toLowerCase() === callKey && activeChatUser && document.getElementById('call-modal').classList.contains('hidden')) {
                startCall();
            }
        });

        // Бесконечная лента TikTok (подгрузка при скролле)
        const feedContainer = document.getElementById('tiktok-feed');
        feedContainer.addEventListener('scroll', () => {
            if (feedContainer.scrollTop + feedContainer.clientHeight >= feedContainer.scrollHeight - 100) {
                loadMoreFeedItems();
            }
        });

        function loadMoreFeedItems() {
            const count = feedContainer.children.length + 1;
            for(let i = 0; i < 2; i++) {
                const card = document.createElement('div');
                card.className = 'tiktok-card';
                card.innerHTML = `Видео #${count + i}<div class="info">Автор: @user_${count + i}</div>`;
                feedContainer.appendChild(card);
            }
        }

        setInterval(refreshData, 4000);
    </script>
</body>
</html>
