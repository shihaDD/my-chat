<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В Одно Ебло</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0b0c10; color: #c5c6c7;
            margin: 0; padding: 0; 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; overflow: hidden;
        }
        .container { 
            width: 100%; max-width: 980px; background: #1f2833; padding: 20px; 
            border-radius: 12px; box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); 
            border: 1px solid #66fcf1; height: 600px; display: flex; flex-direction: column; position: relative;
        }
        .hidden { display: none !important; }
        
        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.92); display: flex; justify-content: center; align-items: center; z-index: 2000; border-radius: 12px; }
        .modal { background: #1f2833; padding: 35px; border-radius: 12px; width: 380px; border: 1px solid #66fcf1; box-shadow: 0 0 30px rgba(102, 252, 241, 0.4); text-align: center; display: flex; flex-direction: column; gap: 14px; }
        .modal h3 { color: #66fcf1; margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        .login-status { font-size: 12px; text-align: left; margin-top: -8px; min-height: 15px; }

        .call-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .call-videos { display: flex; gap: 20px; margin-bottom: 20px; max-width: 90%; max-height: 70vh; }
        video { width: 450px; height: 320px; background: #000; border: 2px solid #66fcf1; border-radius: 8px; object-fit: cover; }
        
        input, button { 
            padding: 12px; font-size: 15px; border: 1px solid #45a29e; border-radius: 6px; outline: none; background: #0b0c10; color: #fff;
        }
        input:focus { border-color: #66fcf1; box-shadow: 0 0 8px rgba(102, 252, 241, 0.6); }
        button { 
            background: #45a29e; color: #0b0c10; border: none; cursor: pointer; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; 
        }
        button:hover:not(:disabled) { background: #66fcf1; box-shadow: 0 0 12px #66fcf1; }
        button:disabled { background: #2c353d; color: #555; border-color: #333; cursor: not-allowed; }

        .app-content { display: flex; gap: 15px; height: 100%; overflow: hidden; }
        .main-nav { width: 180px; border-right: 1px solid #45a29e; display: flex; flex-direction: column; gap: 8px; padding-right: 10px; }
        .nav-btn { background: #0b0c10; border: 1px solid #45a29e; color: #c5c6c7; padding: 10px; text-align: left; border-radius: 6px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .nav-btn:hover, .nav-btn.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }

        .tab-pane { width: 220px; border-right: 1px solid #45a29e; padding-right: 10px; display: flex; flex-direction: column; }
        .pane-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        
        .item-card { padding: 10px; cursor: pointer; border-radius: 6px; background: #0b0c10; border: 1px solid transparent; transition: all 0.2s; color: #c5c6c7; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
        .item-card:hover, .item-card.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }
        .item-card.favorite-item { border-color: #45a29e; background: rgba(69, 162, 158, 0.1); font-weight: bold; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-online { background: #66fcf1; box-shadow: 0 0 6px #66fcf1; }
        .status-offline { background: #555; }

        .content-area { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        .chat-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .call-buttons { display: flex; gap: 8px; }
        .call-buttons button { padding: 6px 12px; font-size: 12px; }

        .messages { flex-grow: 1; border: 1px solid #45a29e; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 12px; background: #0b0c10; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-break: break-word; color: #fff; }
        .msg.me { background: rgba(102, 252, 241, 0.15); border: 1px solid #66fcf1; margin-left: auto; text-align: right; }
        .msg.other { background: #1f2833; border: 1px solid #45a29e; }
        .send-panel { display: flex; gap: 10px; }
        .send-panel input { flex-grow: 1; }

        /* Оформление карточек мемов с картинками */
        .meme-card { background: #0b0c10; border: 1px solid #45a29e; padding: 12px; border-radius: 8px; margin-bottom: 12px; text-align: center; }
        .meme-card img { max-width: 100%; max-height: 300px; border-radius: 6px; margin-top: 8px; border: 1px solid #45a29e; }
        .meme-card p { color: #66fcf1; font-size: 14px; margin: 0 0 6px 0; font-weight: bold; }

        h4 { color: #66fcf1; margin-top: 0; }
        b { color: #66fcf1; }
    </style>
</head>
<body>

<div class="container">
    <div id="authModal" class="modal-overlay">
        <div class="modal">
            <h3>В Одно Ебло</h3>
            <p style="font-size: 13px; color: #aaa; margin: 0;">Придумай статический логин и имя</p>
            <input type="text" id="loginInput" placeholder="Уникальный логин..." oninput="checkLoginAvailability()">
            <div id="loginStatus" class="login-status"></div>
            <input type="text" id="nameInput" placeholder="Ваше имя...">
            <button id="authBtn" onclick="submitAuth()" disabled>Войти в сеть</button>
        </div>
    </div>

    <div id="callModal" class="call-modal hidden">
        <h3 id="callStatusText" style="color: #66fcf1; margin-bottom: 20px;">Соединение...</h3>
        <div class="call-videos">
            <div>
                <p style="font-size:12px; text-align:center; color:#aaa;">Вы</p>
                <video id="localVideo" autoplay muted playsinline></video>
            </div>
            <div>
                <p style="font-size:12px; text-align:center; color:#aaa;">Собеседник</p>
                <video id="remoteVideo" autoplay playsinline></video>
            </div>
        </div>
        <button onclick="endCall()" style="background: #ff007f; color: #fff; border-color: #ff007f;">Завершить звонок</button>
    </div>

    <div class="app-content">
        <div class="main-nav">
            <h4 style="font-size:12px; margin-bottom:5px;">МЕНЮ</h4>
            <button class="nav-btn active" onclick="switchTab('messages')">💬 Сообщения</button>
            <button class="nav-btn" onclick="switchTab('friends')">👥 Друзья</button>
            <button class="nav-btn" onclick="switchTab('news')">🖼 Мемы</button>
            <div style="margin-top:auto; font-size: 11px; color: #45a29e; word-break: break-all;">
                Имя: <b id="currentUserName"></b><br>
                Логин: <span id="currentUserLogin" style="color:#66fcf1;"></span>
            </div>
            <button class="nav-btn" onclick="logout()" style="border-color:#ff007f; color:#ff007f; margin-top:6px;">Выйти</button>
        </div>

        <div class="tab-pane" id="leftPane">
            <h4 id="paneTitle">Сообщения</h4>
            <div id="addFriendBox" class="hidden" style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;">
                <input type="text" id="friendLoginInput" placeholder="Логин друга (например, neo)..." style="font-size:13px; padding:8px;">
                <button onclick="addFriend()" style="font-size:12px; padding:8px;">+ Добавить друга</button>
            </div>
            <div class="pane-list" id="paneList"></div>
        </div>

        <div class="content-area">
            <div class="chat-header">
                <h4 id="contentTitle" style="margin: 0;">Выбери чат</h4>
                <div id="callButtons" class="call-buttons hidden">
                    <button onclick="startCall(false)">📞 Звонок</button>
                    <button onclick="startCall(true)">🖥 Демо</button>
                </div>
            </div>
            
            <div id="chatContainer" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="messages" id="messagesBox"></div>
                <div class="send-panel" id="sendBox">
                    <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>

            <!-- Блок отображения мемов в картинках -->
            <div id="newsContainer" class="hidden" style="overflow-y: auto; height: 100%; padding-right: 5px;">
                <div id="newsList">Загрузка свежих мемов...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let socket = io();
    let currentUserLogin = localStorage.getItem('v_odno_eblo_login') || '';
    let currentPartner = '';
    let currentTab = 'messages';
    let dbData = {};
    let memeList = [];

    let peerConnection;
    let localStream;
    let remoteStream;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    window.onload = async () => {
        await loadData();
        if (currentUserLogin && dbData.users?.[currentUserLogin]) {
            document.getElementById('authModal').classList.add('hidden');
            initApp();
        } else {
            localStorage.removeItem('v_odno_eblo_login');
        }
        fetchMemes();
        setInterval(loadData, 3000);
    };

    socket.on('connect', () => {
        if (currentUserLogin) socket.emit('register', currentUserLogin);
    });

    socket.on('incoming-call', async ({ from, offer, callType }) => {
        const callerName = dbData.users[from]?.name || from;
        if (confirm(`Входящий звонок (${callType ? 'Демонстрация экрана' : 'Голосовой'}) от ${callerName}. Принять?`)) {
            currentPartner = from;
            selectPartner(from);
            await acceptCall(offer, callType);
        } else {
            socket.emit('hang-up', { to: from });
        }
    });

    socket.on('call-answered', async ({ answer }) => {
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        document.getElementById('callStatusText').textContent = 'Соединение установлено';
    });

    socket.on('ice-candidate', async ({ candidate }) => {
        if (peerConnection && candidate) {
            try { await peerConnection.addIceCandidate(new RTCIceCandidate(candidate)); } catch (e) {}
        }
    });

    socket.on('call-ended', () => { closeCall(); });

    function startHeartbeat() {
        setInterval(() => {
            if (currentUserLogin) {
                fetch('/api/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ login: currentUserLogin })
                });
            }
        }, 10000);
    }

    async function loadData() {
        const res = await fetch('/api/data');
        dbData = await res.json();
        if (currentUserLogin && dbData.users?.[currentUserLogin]) {
            updateTabContent();
        }
    }

    let checkTimeout = null;
    async function checkLoginAvailability() {
        const login = document.getElementById('loginInput').value.trim().toLowerCase();
        const statusEl = document.getElementById('loginStatus');
        const authBtn = document.getElementById('authBtn');

        clearTimeout(checkTimeout);
        if (!login || login.length < 2) {
            statusEl.textContent = 'Логин слишком короткий';
            statusEl.style.color = '#ff007f';
            authBtn.disabled = true;
            return;
        }

        checkTimeout = setTimeout(async () => {
            const res = await fetch(`/api/check-login/${login}`);
            const data = await res.json();
            if (data.available) {
                statusEl.textContent = '✔ Логин свободен';
                statusEl.style.color = '#66fcf1';
                authBtn.disabled = false;
            } else {
                statusEl.textContent = '✖ Логин уже занят';
                statusEl.style.color = '#ff007f';
                authBtn.disabled = true;
            }
        }, 300);
    }

    async function submitAuth() {
        const login = document.getElementById('loginInput').value.trim().toLowerCase();
        const name = document.getElementById('nameInput').value.trim();
        if (!login || !name) return alert('Заполните все поля!');

        const res = await fetch('/api/auth', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login, name })
        });
        const data = await res.json();

        if (data.success) {
            currentUserLogin = data.user.login;
            localStorage.setItem('v_odno_eblo_login', currentUserLogin);
            dbData = data.db;
            document.getElementById('authModal').classList.add('hidden');
            initApp();
        }
    }

    function initApp() {
        const userData = dbData.users[currentUserLogin];
        document.getElementById('currentUserName').textContent = userData.name;
        document.getElementById('currentUserLogin').textContent = `@${userData.login}`;
        socket.emit('register', currentUserLogin);
        switchTab('messages');
        startHeartbeat();
    }

    function logout() {
        localStorage.removeItem('v_odno_eblo_login');
        location.reload();
    }

    async function fetchMemes() {
        try {
            const res = await fetch('/api/news');
            const data = await res.json();
            if (data.success) {
                memeList = data.memes;
                if (currentTab === 'news') renderMemes();
            }
        } catch (e) {}
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => {
            if (!b.getAttribute('onclick')?.includes('logout')) b.classList.remove('active');
        });
        event?.target?.classList?.add('active');

        document.getElementById('chatContainer').classList.add('hidden');
        document.getElementById('newsContainer').classList.add('hidden');
        document.getElementById('addFriendBox').classList.add('hidden');
        document.getElementById('callButtons').classList.add('hidden');

        if (tab === 'news') {
            document.getElementById('paneTitle').textContent = 'Мемы';
            document.getElementById('leftPane').classList.add('hidden');
            document.getElementById('contentTitle').textContent = 'Свежие мемы из сети';
            document.getElementById('newsContainer').classList.remove('hidden');
            renderMemes();
        } else {
            document.getElementById('leftPane').classList.remove('hidden');
            if (tab === 'messages') {
                document.getElementById('paneTitle').textContent = 'Сообщения';
            } else if (tab === 'friends') {
                document.getElementById('paneTitle').textContent = 'Друзья';
                document.getElementById('addFriendBox').classList.remove('hidden');
            }
            updateTabContent();
        }
    }

    function isOnline(login) {
        const last = dbData.lastSeen?.[login] || 0;
        return (Date.now() - last) < 20000;
    }

    function updateTabContent() {
        const listDiv = document.getElementById('paneList');
        listDiv.innerHTML = '';
        if (!dbData.users) return;

        if (currentTab === 'messages') {
            const favDiv = document.createElement('div');
            favDiv.className = `item-card favorite-item ${currentPartner === currentUserLogin ? 'active' : ''}`;
            favDiv.innerHTML = `<span>⭐ Избранное</span> <span class="status-dot status-online"></span>`;
            favDiv.onclick = () => selectPartner(currentUserLogin);
            listDiv.appendChild(favDiv);

            Object.values(dbData.users).forEach(u => {
                if (u.login === currentUserLogin) return;
                const online = isOnline(u.login);
                const div = document.createElement('div');
                div.className = `item-card ${currentPartner === u.login ? 'active' : ''}`;
                div.innerHTML = `<span>${u.name} <small style="color:#66fcf1">@${u.login}</small></span> <span class="status-dot ${online ? 'status-online' : 'status-offline'}"></span>`;
                div.onclick = () => selectPartner(u.login);
                listDiv.appendChild(div);
            });
        } else if (currentTab === 'friends') {
            const friendLogins = dbData.friends?.[currentUserLogin] || [];
            if (friendLogins.length === 0) {
                listDiv.innerHTML = '<i style="color:#45a29e; font-size:12px; padding:5px;">Список друзей пуст</i>';
                return;
            }
            friendLogins.forEach(l => {
                const u = dbData.users[l];
                if (!u) return;
                const online = isOnline(l);
                const div = document.createElement('div');
                div.className = `item-card ${currentPartner === l ? 'active' : ''}`;
                div.innerHTML = `<span>${u.name} <small style="color:#66fcf1">@${u.login}</small></span> <span class="status-dot ${online ? 'status-online' : 'status-offline'}"></span>`;
                div.onclick = () => selectPartner(l);
                listDiv.appendChild(div);
            });
        }
    }

    async function addFriend() {
        const targetLogin = document.getElementById('friendLoginInput').value.trim();
        if (!targetLogin) return alert('Введите логин друга!');

        const res = await fetch('/api/add-friend', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ login: currentUserLogin, targetLogin })
        });
        const data = await res.json();
        if (data.success) {
            dbData = data.db;
            document.getElementById('friendLoginInput').value = '';
            alert('Друг успешно добавлен!');
            updateTabContent();
        } else {
            alert(data.error || 'Ошибка');
        }
    }

    function selectPartner(login) {
        currentPartner = login;
        const partnerObj = dbData.users[login];
        const titleText = login === currentUserLogin ? '⭐ Избранное (Заметки)' : `Чат с: ${partnerObj?.name} (@${login})`;
        document.getElementById('contentTitle').textContent = titleText;
        document.getElementById('chatContainer').classList.remove('hidden');
        
        if (login !== currentUserLogin) {
            document.getElementById('callButtons').classList.remove('hidden');
        } else {
            document.getElementById('callButtons').classList.add('hidden');
        }

        renderMessages();
    }

    function renderMessages() {
        const messagesBox = document.getElementById('messagesBox');
        messagesBox.innerHTML = '';
        const chatHistory = dbData.messagesStore?.[currentUserLogin]?.[currentPartner] || [];
        
        if (chatHistory.length === 0) {
            messagesBox.innerHTML = '<i style="color:#45a29e;">История пуста. Напишите что-нибудь!</i>';
            return;
        }

        chatHistory.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.sender === currentUserLogin && currentPartner !== currentUserLogin ? 'me' : 'other'}`;
            const senderName = dbData.users[m.sender]?.name || m.sender;
            div.innerHTML = `<b>${senderName}:</b> ${m.text} <br><small style="font-size:10px; color:#888;">${m.time}</small>`;
            messagesBox.appendChild(div);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function renderMemes() {
        const newsList = document.getElementById('newsList');
        newsList.innerHTML = '';
        if (memeList.length === 0) {
            newsList.innerHTML = 'Загрузка мемов...';
            return;
        }
        memeList.forEach(m => {
            const div = document.createElement('div');
            div.className = 'meme-card';
            div.innerHTML = `
                <p>${m.title}</p>
                <img src="${m.image}" alt="meme" loading="lazy">
                <br><small style="color:#888; font-size:11px;">Автор: ${m.author}</small>
            `;
            newsList.appendChild(div);
        });
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !currentPartner) return;

        const res = await fetch('/api/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUserLogin, receiver: currentPartner, text })
        });
        const data = await res.json();
        dbData = data.db;
        input.value = '';
        renderMessages();
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }

    // WebRTC функции звонков
    async function createPeerConnection(toLogin) {
        peerConnection = new RTCPeerConnection(rtcConfig);
        remoteStream = new MediaStream();
        document.getElementById('remoteVideo').srcObject = remoteStream;

        peerConnection.ontrack = (event) => {
            event.streams[0].getTracks().forEach(track => remoteStream.addTrack(track));
        };
        peerConnection.onicecandidate = (event) => {
            if (event.candidate) socket.emit('ice-candidate', { to: toLogin, candidate: event.candidate });
        };
        if (localStream) {
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
        }
    }

    async function startCall(isScreenShare) {
        if (!currentPartner || currentPartner === currentUserLogin) return alert('Выберите собеседника');
        document.getElementById('callModal').classList.remove('hidden');
        document.getElementById('callStatusText').textContent = isScreenShare ? 'Запуск демонстрации...' : 'Вызов...';

        try {
            if (isScreenShare) {
                localStream = await navigator.mediaDevices.getDisplayMedia({ video: true, audio: true });
            } else {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            }
            document.getElementById('localVideo').srcObject = localStream;

            await createPeerConnection(currentPartner);
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);

            socket.emit('call-user', { to: currentPartner, offer, from: currentUserLogin, callType: isScreenShare });
        } catch (e) {
            alert('Ошибка доступа к камере/экрану');
            closeCall();
        }
    }

    async function acceptCall(offer, isScreenShare) {
        document.getElementById('callModal').classList.remove('hidden');
        document.getElementById('callStatusText').textContent = 'Подключение...';

        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: !isScreenShare, audio: true });
            document.getElementById('localVideo').srcObject = localStream;

            await createPeerConnection(currentPartner);
            await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);

            socket.emit('call-accepted', { to: currentPartner, answer });
            document.getElementById('callStatusText').textContent = 'Соединение установлено';
        } catch (e) {
            closeCall();
        }
    }

    function endCall() {
        socket.emit('hang-up', { to: currentPartner });
        closeCall();
    }

    function closeCall() {
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (peerConnection) peerConnection.close();
        peerConnection = null;
        localStream = null;
        document.getElementById('callModal').classList.add('hidden');
    }
</script>

</body>
</html>
