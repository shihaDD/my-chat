<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В Одно Ебло</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0b0c10; 
            color: #c5c6c7;
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 950px; 
            background: #1f2833; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); 
            border: 1px solid #66fcf1;
            height: 580px; 
            display: flex; 
            flex-direction: column; 
        }
        .hidden { display: none !important; }
        
        /* Авторизация */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .auth-box { width: 340px; display: flex; flex-direction: column; gap: 14px; }
        .auth-box h3 { text-align: center; margin-bottom: 5px; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        
        input, button { 
            padding: 12px; 
            font-size: 15px; 
            border: 1px solid #45a29e; 
            border-radius: 6px; 
            outline: none; 
            background: #0b0c10;
            color: #fff;
        }
        input:focus { border-color: #66fcf1; box-shadow: 0 0 8px rgba(102, 252, 241, 0.6); }
        
        button { 
            background: #45a29e; 
            color: #0b0c10; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s; 
        }
        button:hover { background: #66fcf1; box-shadow: 0 0 12px #66fcf1; }

        /* Модалка кода */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #1f2833; padding: 30px; border-radius: 12px; width: 340px; border: 1px solid #66fcf1; box-shadow: 0 0 25px rgba(102, 252, 241, 0.4); text-align: center; }
        .code-input { font-size: 24px; text-align: center; letter-spacing: 12px; width: 80%; margin-bottom: 15px; background: #0b0c10; color: #66fcf1; border: 1px solid #45a29e; }
        .debug-hint { font-size: 12px; color: #ff007f; background: rgba(255, 0, 127, 0.1); border: 1px solid #ff007f; padding: 8px; border-radius: 4px; margin-bottom: 15px; }

        /* Главный интерфейс */
        .app-content { display: flex; gap: 15px; height: 100%; overflow: hidden; }
        
        /* Левое главное меню (Вкладки) */
        .main-nav { width: 180px; border-right: 1px solid #45a29e; display: flex; flex-direction: column; gap: 8px; padding-right: 10px; }
        .nav-btn { background: #0b0c10; border: 1px solid #45a29e; color: #c5c6c7; padding: 10px; text-align: left; border-radius: 6px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .nav-btn:hover, .nav-btn.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }

        /* Панель контента вкладки */
        .tab-pane { width: 220px; border-right: 1px solid #45a29e; padding-right: 10px; display: flex; flex-direction: column; }
        .pane-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; }
        .item-card { padding: 10px; cursor: pointer; border-radius: 6px; margin-bottom: 6px; background: #0b0c10; border: 1px solid transparent; transition: all 0.2s; color: #c5c6c7; font-size: 14px; }
        .item-card:hover, .item-card.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }

        /* Чат или просмотр контента */
        .content-area { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        .messages { flex-grow: 1; border: 1px solid #45a29e; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 12px; background: #0b0c10; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-break: break-word; color: #fff; }
        .msg.me { background: rgba(102, 252, 241, 0.15); border: 1px solid #66fcf1; margin-left: auto; text-align: right; }
        .msg.other { background: #1f2833; border: 1px solid #45a29e; }
        .send-panel { display: flex; gap: 10px; }
        .send-panel input { flex-grow: 1; }

        /* Новостные карточки */
        .news-item { background: #0b0c10; border: 1px solid #45a29e; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; color: #c5c6c7; text-decoration: none; display: block; }
        .news-item:hover { border-color: #66fcf1; color: #66fcf1; }

        h4 { color: #66fcf1; margin-top: 0; }
        b { color: #66fcf1; }
    </style>
</head>
<body>

<div class="container">
    <!-- ВХОД -->
    <div id="auth-screen">
        <div class="auth-box">
            <h3>В Одно Ебло</h3>
            <input type="text" id="nameInput" placeholder="Твое имя...">
            <input type="text" id="phoneInput" placeholder="+7 (___) ___-__-__">
            <button onclick="requestVerificationCode()">Продолжить</button>
        </div>
    </div>

    <!-- МОДАЛКА КОДА -->
    <div id="codeModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Авторизация</h3>
            <p>Код подтверждения отправлен</p>
            <div id="debugHint" class="debug-hint"></div>
            <input type="text" id="codeInput" class="code-input" maxlength="4" placeholder="----">
            <br>
            <button onclick="verifyCode()" style="width: 100%;">Войти</button>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="app-screen" class="hidden app-content">
        <!-- Навигация слева -->
        <div class="main-nav">
            <h4 style="font-size:12px; margin-bottom:5px;">МЕНЮ</h4>
            <button class="nav-btn active" onclick="switchTab('messages')">💬 Сообщения</button>
            <button class="nav-btn" onclick="switchTab('friends')">👥 Друзья</button>
            <button class="nav-btn" onclick="switchTab('favorites')">⭐ Избранное</button>
            <button class="nav-btn" onclick="switchTab('news')">📰 Новости</button>
            <div style="margin-top: auto; font-size: 11px; color: #45a29e;">Профиль: <br><b id="currentUserName"></b></div>
        </div>

        <!-- Подменю -->
        <div class="tab-pane" id="leftPane">
            <h4 id="paneTitle">Чаты</h4>
            <div class="pane-list" id="paneList"></div>
        </div>

        <!-- Область контента -->
        <div class="content-area">
            <h4 id="contentTitle" style="margin-bottom: 10px;">Выбери чат</h4>
            
            <!-- Окно чата -->
            <div id="chatContainer" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="messages" id="messagesBox"></div>
                <div class="send-panel" id="sendBox">
                    <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>

            <!-- Окно новостей -->
            <div id="newsContainer" class="hidden" style="overflow-y: auto; height: 100%; padding-right: 5px;">
                <div id="newsList">Загрузка новостей из Google...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = '';
    let currentPartner = '';
    let currentPhone = '';
    let currentTab = 'messages';
    let dbData = {};
    let googleNews = [];

    // Маска ввода телефона (+7 (XXX) XXX-XX-XX)
    const phoneInput = document.getElementById('phoneInput');
    phoneInput.addEventListener('input', function (e) {
        let matrix = '+7 (___) ___-__-__',
            i = 0,
            def = matrix.replace(/\D/g, ''),
            val = this.value.replace(/\D/g, '');
        
        if (val.length >= 1 && val[0] === '8') val = val.slice(1);
        if (val.length >= 1 && val[0] === '7') val = val.slice(1);

        let res = matrix.replace(/./g, function (a) {
            return /[_\d]/.test(a) && i < val ? val.charAt(i++) : i >= val ? '' : a;
        });
        
        if (i === 0) {
            this.value = '';
        } else {
            this.value = res;
        }
    });

    async function loadData() {
        const res = await fetch('/api/data');
        dbData = await res.json();
        if (currentUser) updateTabContent();
    }

    async function requestVerificationCode() {
        const name = document.getElementById('nameInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();
        if (!name || phone.length < 18) return alert('Заполни имя и корректный номер телефона!');

        const res = await fetch('/api/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone })
        });
        const data = await res.json();
        if (data.success) {
            currentPhone = phone;
            document.getElementById('debugHint').textContent = `Код для входа: ${data.debugCode}`;
            document.getElementById('codeModal').classList.remove('hidden');
        }
    }

    async function verifyCode() {
        const code = document.getElementById('codeInput').value.trim();
        if (code.length !== 4) return alert('Введи 4-значный код!');

        const res = await fetch('/api/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: currentPhone, code })
        });
        const data = await res.json();

        if (data.success) {
            currentUser = data.username;
            dbData = data.db;
            document.getElementById('codeModal').classList.add('hidden');
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('currentUserName').textContent = currentUser;

            switchTab('messages');
            fetchNews();
            setInterval(loadData, 3000);
        } else {
            alert('Неверный код!');
        }
    }

    async function fetchNews() {
        try {
            const res = await fetch('/api/news');
            const data = await res.json();
            if (data.success) {
                googleNews = data.news;
                if (currentTab === 'news') renderNews();
            }
        } catch (e) { console.error('Ошибка загрузки новостей'); }
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        event.target.classList.add('active');

        document.getElementById('chatContainer').classList.add('hidden');
        document.getElementById('newsContainer').classList.add('hidden');

        if (tab === 'news') {
            document.getElementById('paneTitle').textContent = 'Google Новости';
            document.getElementById('leftPane').classList.add('hidden');
            document.getElementById('contentTitle').textContent = 'Свежие новости от Google';
            document.getElementById('newsContainer').classList.remove('hidden');
            renderNews();
        } else {
            document.getElementById('leftPane').classList.remove('hidden');
            if (tab === 'messages') document.getElementById('paneTitle').textContent = 'Сообщения';
            if (tab === 'friends') document.getElementById('paneTitle').textContent = 'Друзья';
            if (tab === 'favorites') document.getElementById('paneTitle').textContent = 'Избранное';
            updateTabContent();
        }
    }

    function updateTabContent() {
        const listDiv = document.getElementById('paneList');
        listDiv.innerHTML = '';

        if (currentTab === 'messages' || currentTab === 'friends') {
            dbData.users.forEach(user => {
                if (user === currentUser) return;
                const div = document.createElement('div');
                div.className = `item-card ${currentPartner === user ? 'active' : ''}`;
                div.textContent = user;
                div.onclick = () => selectPartner(user);
                listDiv.appendChild(div);
            });
        } else if (currentTab === 'favorites') {
            const favs = dbData.favorites?.[currentUser] || [];
            if (favs.length === 0) {
                listDiv.innerHTML = '<i style="color:#45a29e; font-size:12px;">Пусто</i>';
                return;
            }
            favs.forEach(user => {
                const div = document.createElement('div');
                div.className = `item-card ${currentPartner === user ? 'active' : ''}`;
                div.textContent = user;
                div.onclick = () => selectPartner(user);
                listDiv.appendChild(div);
            });
        }
    }

    function selectPartner(user) {
        currentPartner = user;
        document.getElementById('contentTitle').textContent = `Чат с: ${user}`;
        document.getElementById('chatContainer').classList.remove('hidden');
        renderMessages();
    }

    function renderMessages() {
        const messagesBox = document.getElementById('messagesBox');
        messagesBox.innerHTML = '';
        const chatHistory = dbData.messagesStore?.[currentUser]?.[currentPartner] || [];
        
        if (chatHistory.length === 0) {
            messagesBox.innerHTML = '<i style="color:#45a29e;">Нет сообщений. Напиши первым!</i>';
            return;
        }

        chatHistory.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.sender === currentUser ? 'me' : 'other'}`;
            div.innerHTML = `<b>${m.sender}:</b> ${m.text} <br><small style="font-size:10px; color:#888;">${m.time}</small>`;
            messagesBox.appendChild(div);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function renderNews() {
        const newsList = document.getElementById('newsList');
        newsList.innerHTML = '';
        if (googleNews.length === 0) {
            newsList.innerHTML = 'Загрузка...';
            return;
        }
        googleNews.forEach(n => {
            const a = document.createElement('a');
            a.className = 'news-item';
            a.href = n.link;
            a.target = '_blank';
            a.innerHTML = `<b>${n.date}</b><br>${n.title}`;
            newsList.appendChild(a);
        });
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !currentPartner) return;

        const res = await fetch('/api/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, receiver: currentPartner, text })
        });
        const data = await res.json();
        dbData = data.db;
        input.value = '';
        renderMessages();
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
