<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мессенджер</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
:root{--bg:#0f0f0f;--bg2:#1a1a2e;--bg3:#16213e;--bg4:#0f3460;--accent:#e94560;--accent2:#0f3460;--text:#eee;--text2:#aaa;--green:#4CAF50;--red:#f44336;--border:#333}
body{background:var(--bg);color:var(--text);overflow:hidden;height:100vh}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-track{background:var(--bg2)}::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}
.hidden{display:none!important}
button{cursor:pointer;border:none;outline:none;transition:.2s}
input,textarea,select{outline:none}
.btn{background:var(--accent);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:600}
.btn:hover{opacity:.85}
.btn-sec{background:var(--bg4);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px}
.btn-sec:hover{opacity:.85}
.btn-ghost{background:transparent;color:var(--text2);padding:8px 12px;border-radius:6px;font-size:13px}
.btn-ghost:hover{background:var(--bg2)}

/* Auth */
#auth-screen{display:flex;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#0f0f0f,#1a1a2e,#16213e)}
.auth-box{background:var(--bg2);padding:40px;border-radius:16px;width:380px;max-width:90vw;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.auth-box h1{text-align:center;margin-bottom:24px;font-size:22px}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}
.auth-tabs button{flex:1;padding:10px;border-radius:8px;font-size:14px;font-weight:600}
.auth-tabs .active{background:var(--accent);color:#fff}
.auth-tabs .inactive{background:var(--bg3);color:var(--text2)}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:13px;color:var(--text2);margin-bottom:5px}
.auth-field input{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.auth-field input:focus{border-color:var(--accent)}
.auth-checkbox{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--text2)}
.auth-checkbox input{width:16px;height:16px;accent-color:var(--accent)}
.auth-err{color:var(--red);font-size:13px;margin-bottom:10px;min-height:18px}

/* Layout */
#app{display:flex;height:100vh}
#sidebar{width:64px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;border-right:1px solid var(--border)}
#sidebar .nav-btn{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:transparent;color:var(--text2)}
#sidebar .nav-btn:hover{background:var(--bg3)}
#sidebar .nav-btn.active{background:var(--accent);color:#fff}
#sidebar .spacer{flex:1}
#content{flex:1;display:flex;overflow:hidden}
.view{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* Chat */
#chat-view{flex-direction:row}
#chat-list-panel{width:300px;border-right:1px solid var(--border);display:flex;flex-direction:column;background:var(--bg)}
#chat-list-header{padding:16px;font-size:18px;font-weight:700;border-bottom:1px solid var(--border)}
#chat-list{flex:1;overflow-y:auto}
.chat-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;gap:10px;align-items:center}
.chat-item:hover{background:var(--bg2)}
.chat-item.active{background:var(--bg3)}
.chat-item .avatar{width:40px;height:40px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;overflow:hidden}
.chat-item .info{flex:1;min-width:0}
.chat-item .name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .last{font-size:12px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.status-online{background:var(--green)}.status-offline{background:#555}

#chat-main{flex:1;display:flex;flex-direction:column;background:var(--bg)}
#chat-header{padding:12px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2)}
#chat-header .avatar{width:36px;height:36px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;overflow:hidden}
#chat-header .name{font-size:16px;font-weight:600}
#chat-header .status{font-size:12px;color:var(--text2)}
#chat-body{flex:1;overflow-y:auto;padding:16px 20px}
.msg{margin-bottom:8px;max-width:70%}
.msg .msg-bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.4;word-wrap:break-word}
.msg.mine .msg-bubble{background:var(--bg4);margin-left:auto;border-bottom-right-radius:4px}
.msg.other .msg-bubble{background:var(--bg3);border-bottom-left-radius:4px}
.msg .msg-meta{font-size:11px;color:var(--text2);margin-top:3px}
.msg.mine .msg-meta{text-align:right}
.msg-actions{display:inline-flex;gap:4px;margin-left:8px}
.msg-actions button{background:transparent;color:var(--text2);font-size:11px;padding:2px 4px;border-radius:4px}
.msg-actions button:hover{background:var(--bg2)}
.pinned-bar{padding:8px 20px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:13px;display:flex;align-items:center;gap:8px}
.pinned-bar .unpin-btn{margin-left:auto;background:transparent;color:var(--text2);font-size:12px}

#chat-input-area{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;background:var(--bg2)}
#chat-input{flex:1;padding:10px 14px;background:var(--bg);border:1px solid var(--border);border-radius:20px;color:var(--text);font-size:14px}
#chat-input:focus{border-color:var(--accent)}
#chat-send{width:40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
.edit-bar{padding:8px 20px;background:var(--bg3);font-size:13px;display:flex;align-items:center;gap:10px}
.edit-bar button{background:transparent;color:var(--accent);font-size:13px}

/* Friends */
#friends-view{padding:20px;overflow-y:auto}
.section-title{font-size:18px;font-weight:700;margin-bottom:16px}
.friends-add{display:flex;gap:10px;margin-bottom:24px}
.friends-add input{flex:1;padding:10px 12px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.subsection{margin-bottom:24px}
.subsection h3{font-size:15px;margin-bottom:12px;color:var(--text2)}
.friend-card{display:flex;align-items:center;gap:12px;padding:10px;background:var(--bg2);border-radius:10px;margin-bottom:8px}
.friend-card .avatar{width:40px;height:40px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.friend-card .info{flex:1}
.friend-card .name{font-size:14px;font-weight:600}
.friend-card .login{font-size:12px;color:var(--text2)}

/* Groups */
#groups-view{padding:20px;overflow-y:auto}
.group-create-box{background:var(--bg2);padding:20px;border-radius:12px;margin-bottom:24px}
.group-create-box input,.group-create-box textarea{width:100%;padding:10px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;margin-bottom:10px}
.checkbox-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--text2)}
.checkbox-row input{width:16px;height:16px;accent-color:var(--accent)}
.group-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--bg2);border-radius:10px;margin-bottom:8px;cursor:pointer}
.group-card:hover{background:var(--bg3)}
.group-card .avatar{width:44px;height:44px;border-radius:12px;background:var(--bg4);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:18px}
.group-badge{background:var(--accent);color:#fff;font-size:11px;padding:2px 6px;border-radius:4px;margin-left:4px}
.verified-badge{color:#1DA1F2;font-size:14px}

/* Group detail */
#group-detail-view{flex:1;display:flex;flex-direction:column;overflow:hidden}
.group-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;background:var(--bg2)}
.group-header .avatar{width:40px;height:40px;border-radius:12px;background:var(--bg4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.group-header .name{font-size:16px;font-weight:600}
.group-channels{display:flex;flex:1;overflow:hidden}
.channels-sidebar{width:200px;border-right:1px solid var(--border);padding:12px 0;overflow-y:auto;background:var(--bg)}
.channels-sidebar h4{font-size:12px;color:var(--text2);padding:8px 16px;text-transform:uppercase}
.channel-item{padding:8px 16px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.channel-item:hover{background:var(--bg2)}
.channel-item.active{background:var(--bg3);color:var(--accent)}
.channel-content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.voice-channel-view{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.voice-channel-view .voice-info{font-size:16px;color:var(--text2)}

/* News */
#news-view{padding:20px;overflow-y:auto;max-width:700px;margin:0 auto;width:100%}
.news-item{background:var(--bg2);padding:16px;border-radius:12px;margin-bottom:16px}
.news-item .author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.news-item .author .avatar{width:36px;height:36px;border-radius:50%;background:var(--bg4);display:flex;align-items:center;justify-content:center;overflow:hidden}
.news-item .author .name{font-size:14px;font-weight:600}
.news-item .author .time{font-size:12px;color:var(--text2)}
.news-item .text{font-size:14px;line-height:1.5;margin-bottom:10px}
.news-media{display:flex;flex-wrap:wrap;gap:8px}
.news-media img{max-width:200px;border-radius:8px}
.news-publish-box{background:var(--bg2);padding:16px;border-radius:12px;margin-bottom:20px}
.news-publish-box textarea{width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px;min-height:60px;resize:vertical;margin-bottom:10px}

/* Radio */
#radio-view{padding:20px;overflow-y:auto}
.radio-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.radio-card{background:var(--bg2);padding:16px;border-radius:12px;cursor:pointer;text-align:center;transition:.2s}
.radio-card:hover{background:var(--bg3)}
.radio-card.playing{border:2px solid var(--accent)}
.radio-card .icon{font-size:36px;margin-bottom:8px}
.radio-card .name{font-size:14px;font-weight:600}
.radio-player{position:fixed;bottom:20px;right:20px;background:var(--bg2);padding:12px 20px;border-radius:12px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(0,0,0,.5);z-index
