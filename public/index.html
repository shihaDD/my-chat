<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с сохранением на GitHub</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 4px; }
        button { padding: 8px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <h1>Управление базой данных</h1>

    <div class="box">
        <h3>Содержимое database.json с сервера:</h3>
        <button onclick="loadData()">Обновить данные</button>
        <pre id="dbContent">Загрузка...</pre>
    </div>

    <div class="box">
        <h3>Добавить тестовое действие</h3>
        <button onclick="sendUpdate()">Сделать запрос к /api/update</button>
    </div>

    <script>
        async function loadData() {
            try {
                const response = await fetch('/api/data');
                const data = await response.json();
                document.getElementById('dbContent').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                document.getElementById('dbContent').textContent = 'Ошибка загрузки данных';
            }
        }

        async function sendUpdate() {
            try {
                const response = await fetch('/api/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'test', time: new Date().toISOString() })
                });
                const result = await response.json();
                alert('Данные обновлены и отправлены на GitHub!');
                document.getElementById('dbContent').textContent = JSON.stringify(result.db, null, 2);
            } catch (e) {
                alert('Ошибка при обновлении');
            }
        }

        // Загружаем данные при открытии страницы
        loadData();
    </script>

</body>
</html>
