<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В Одно Ебло</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0b0c10; 
            color: #c5c6c7;
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 950px; 
            background: #1f2833; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); 
            border: 1px solid #66fcf1;
            height: 580px; 
            display: flex; 
            flex-direction: column; 
        }
        .hidden { display: none !important; }
        
        /* Авторизация */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .auth-box { width: 340px; display: flex; flex-direction: column; gap: 14px; }
        .auth-box h3 { text-align: center; margin-bottom: 5px; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        
        input, button { 
            padding: 12px; 
            font-size: 15px; 
            border: 1px solid #45a29e; 
            border-radius: 6px; 
            outline: none; 
            background: #0b0c10;
            color: #fff;
        }
        input:focus { border-color: #66fcf1; box-shadow: 0 0 8px rgba(102, 252, 241, 0.6); }
        
        button { 
            background: #45a29e; 
            color: #0b0c10; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s; 
        }
        button:hover { background: #66fcf1; box-shadow: 0 0 12px #66fcf1; }

        /* Модалка приветствия с ID */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #1f2833; padding: 30px; border-radius: 12px; width: 360px; border: 1px solid #66fcf1; box-shadow: 0 0 25px rgba(102, 252, 241, 0.4); text-align: center; }
        .modal h3 { color: #66fcf1; margin-top: 0; }
        .id-badge { font-size: 24px; font-weight: bold; color: #66fcf1; background: #0b0c10; padding: 10px; border-radius: 6px; border: 1px solid #45a29e; margin: 15px 0; letter-spacing: 3px; }

        /* Главный интерфейс */
        .app-content { display: flex; gap: 15px; height: 100%; overflow: hidden; }
        
        .main-nav { width: 180px; border-right: 1px solid #45a29e; display: flex; flex-direction: column; gap: 8px; padding-right: 10px; }
        .nav-btn { background: #0b0c10; border: 1px solid #45a29e; color: #c5c6c7; padding: 10px; text-align: left; border-radius: 6px; cursor: pointer; font-size: 13px; text-transform: uppercase; }
        .nav-btn:hover, .nav-btn.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }

        .tab-pane { width: 220px; border-right: 1px solid #45a29e; padding-right: 10px; display: flex; flex-direction: column; }
        .pane-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; display: flex; flex-direction: column; gap: 6px; }
        
        .item-card { padding: 10px; cursor: pointer; border-radius: 6px; background: #0b0c10; border: 1px solid transparent; transition: all 0.2s; color: #c5c6c7; font-size: 14px; display: flex; align-items: center; justify-content: space-between; }
        .item-card:hover, .item-card.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }
        .item-card.favorite-item { border-color: #45a29e; background: rgba(69, 162, 158, 0.1); font-weight: bold; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
        .status-online { background: #66fcf1; box-shadow: 0 0 6px #66fcf1; }
        .status-offline { background: #555; }

        .content-area { flex-grow: 1; display: flex; flex-direction: column; height: 100%; }
        .messages { flex-grow: 1; border: 1px solid #45a29e; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 12px; background: #0b0c10; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-break: break-word; color: #fff; }
        .msg.me { background: rgba(102, 252, 241, 0.15); border: 1px solid #66fcf1; margin-left: auto; text-align: right; }
        .msg.other { background: #1f2833; border: 1px solid #45a29e; }
        .send-panel { display: flex; gap: 10px; }
        .send-panel input { flex-grow: 1; }

        .news-item { background: #0b0c10; border: 1px solid #45a29e; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; color: #c5c6c7; text-decoration: none; display: block; }
        .news-item:hover { border-color: #66fcf1; color: #66fcf1; }

        h4 { color: #66fcf1; margin-top: 0; }
        b { color: #66fcf1; }
    </style>
</head>
<body>

<div class="container">
    <!-- ВХОД -->
    <div id="auth-screen">
        <div class="auth-box">
            <h3>В Одно Ебло</h3>
            <input type="text" id="nameInput" placeholder="Твой никнейм..." onkeypress="if(event.key==='Enter')login()">
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <!-- МОДАЛКА НОВОГО ПОЛЬЗОВАТЕЛЯ С ID -->
    <div id="idModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Добро пожаловать!</h3>
            <p style="font-size: 13px; color: #c5c6c7;">Твой уникальный ID для добавления в друзья:</p>
            <div class="id-badge" id="myAssignedId">123456</div>
            <p style="font-size: 11px; color: #888;">Сохрани его, друзья смогут добавлять тебя по этому номеру.</p>
            <button onclick="closeIdModal()" style="width: 100%; margin-top: 10px;">Понятно, в бой</button>
        </div>
    </div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="app-screen" class="hidden app-content">
        <div class="main-nav">
            <h4 style="font-size:12px; margin-bottom:5px;">МЕНЮ</h4>
            <button class="nav-btn active" onclick="switchTab('messages')">💬 Сообщения</button>
            <button class="nav-btn" onclick="switchTab('friends')">👥 Друзья</button>
            <button class="nav-btn" onclick="switchTab('news')">📰 Новости</button>
            <div style="margin-top:auto; font-size: 11px; color: #45a29e; word-break: break-all;">
                Ник: <b id="currentUserName"></b><br>
                ID: <span id="currentUserId" style="color:#66fcf1;"></span>
            </div>
            <button class="nav-btn" onclick="logout()" style="border-color:#ff007f; color:#ff007f; margin-top:6px;">Выйти</button>
        </div>

        <div class="tab-pane" id="leftPane">
            <h4 id="paneTitle">Сообщения</h4>
            <!-- Форма добавления друга по ID -->
            <div id="addFriendBox" class="hidden" style="margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px;">
                <input type="text" id="friendIdInput" placeholder="Введите 6-значный ID..." style="font-size:13px; padding:8px;">
                <button onclick="addFriendById()" style="font-size:12px; padding:8px;">+ Добавить друга</button>
            </div>
            <div class="pane-list" id="paneList"></div>
        </div>

        <div class="content-area">
            <h4 id="contentTitle" style="margin-bottom: 10px;">Выбери чат</h4>
            
            <div id="chatContainer" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
                <div class="messages" id="messagesBox"></div>
                <div class="send-panel" id="sendBox">
                    <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">Отправить</button>
                </div>
            </div>

            <div id="newsContainer" class="hidden" style="overflow-y: auto; height: 100%; padding-right: 5px;">
                <div id="newsList">Загрузка новостей из Google...</div>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = localStorage.getItem('v_odno_eblo_user') || '';
    let currentId = localStorage.getItem('v_odno_eblo_id') || '';
    let currentPartner = '';
    let currentTab = 'messages';
    let dbData = {};
    let googleNews = [];

    window.onload = async () => {
        await loadData();
        if (currentUser && dbData.users?.includes(currentUser)) {
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('currentUserName').textContent = currentUser;
            document.getElementById('currentUserId').textContent = dbData.userIds?.[currentUser] || currentId;
            switchTab('messages');
            startHeartbeat();
        } else {
            localStorage.removeItem('v_odno_eblo_user');
            localStorage.removeItem('v_odno_eblo_id');
        }
        fetchNews();
        setInterval(loadData, 3000);
    };

    function startHeartbeat() {
        setInterval(() => {
            if (currentUser) {
                fetch('/api/ping', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUser })
                });
            }
        }, 10000);
    }

    async function loadData() {
        const res = await fetch('/api/data');
        dbData = await res.json();
        if (currentUser) updateTabContent();
    }

    async function login() {
        const username = document.getElementById('nameInput').value.trim();
        if (!username) return alert('Введите никнейм!');

        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username })
        });
        const data = await res.json();

        if (data.success) {
            currentUser = data.username;
            currentId = data.userId;
            localStorage.setItem('v_odno_eblo_user', currentUser);
            localStorage.setItem('v_odno_eblo_id', currentId);
            dbData = data.db;

            document.getElementById('auth-screen').classList.add('hidden');

            if (data.isNew) {
                document.getElementById('myAssignedId').textContent = currentId;
                document.getElementById('idModal').classList.remove('hidden');
            } else {
                initAppAfterLogin();
            }
        } else {
            alert(data.error || 'Ошибка входа');
        }
    }

    function closeIdModal() {
        document.getElementById('idModal').classList.add('hidden');
        initAppAfterLogin();
    }

    function initAppAfterLogin() {
        document.getElementById('app-screen').classList.remove('hidden');
        document.getElementById('currentUserName').textContent = currentUser;
        document.getElementById('currentUserId').textContent = currentId;
        switchTab('messages');
        startHeartbeat();
    }

    function logout() {
        localStorage.removeItem('v_odno_eblo_user');
        localStorage.removeItem('v_odno_eblo_id');
        location.reload();
    }

    async function fetchNews() {
        try {
            const res = await fetch('/api/news');
            const data = await res.json();
            if (data.success) {
                googleNews = data.news;
                if (currentTab === 'news') renderNews();
            }
        } catch (e) {}
    }

    function switchTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => {
            if (!b.getAttribute('onclick')?.includes('logout')) b.classList.remove('active');
        });
        
        // Находим активную кнопку по клику или принудительно
        event?.target?.classList?.add('active');

        document.getElementById('chatContainer').classList.add('hidden');
        document.getElementById('newsContainer').classList.add('hidden');
        document.getElementById('addFriendBox').classList.add('hidden');

        if (tab === 'news') {
            document.getElementById('paneTitle').textContent = 'Google Новости';
            document.getElementById('leftPane').classList.add('hidden');
            document.getElementById('contentTitle').textContent = 'Свежие новости от Google';
            document.getElementById('newsContainer').classList.remove('hidden');
            renderNews();
        } else {
            document.getElementById('leftPane').classList.remove('hidden');
            if (tab === 'messages') {
                document.getElementById('paneTitle').textContent = 'Сообщения';
            } else if (tab === 'friends') {
                document.getElementById('paneTitle').textContent = 'Друзья';
                document.getElementById('addFriendBox').classList.remove('hidden');
            }
            updateTabContent();
        }
    }

    function isOnline(username) {
        const last = dbData.lastSeen?.[username] || 0;
        return (Date.now() - last) < 20000;
    }

    function updateTabContent() {
        const listDiv = document.getElementById('paneList');
        listDiv.innerHTML = '';

        if (currentTab === 'messages') {
            // Закрепленное Избранное сверху
            const favDiv = document.createElement('div');
            favDiv.className = `item-card favorite-item ${currentPartner === currentUser ? 'active' : ''}`;
            favDiv.innerHTML = `<span>⭐ Избранное</span> <span class="status-dot status-online"></span>`;
            favDiv.onclick = () => selectPartner(currentUser);
            listDiv.appendChild(favDiv);

            // Остальные пользователи
            dbData.users?.forEach(user => {
                if (user === currentUser) return;
                const online = isOnline(user);
                const div = document.createElement('div');
                div.className = `item-card ${currentPartner === user ? 'active' : ''}`;
                div.innerHTML = `<span>${user}</span> <span class="status-dot ${online ? 'status-online' : 'status-offline'}"></span>`;
                div.onclick = () => selectPartner(user);
                listDiv.appendChild(div);
            });
        } else if (currentTab === 'friends') {
            const friends = dbData.friends?.[currentUser] || [];
            if (friends.length === 0) {
                listDiv.innerHTML = '<i style="color:#45a29e; font-size:12px; padding:5px;">Список друзей пуст</i>';
                return;
            }
            friends.forEach(user => {
                const online = isOnline(user);
                const div = document.createElement('div');
                div.className = `item-card ${currentPartner === user ? 'active' : ''}`;
                div.innerHTML = `<span>${user}</span> <span class="status-dot ${online ? 'status-online' : 'status-offline'}"></span>`;
                div.onclick = () => selectPartner(user);
                listDiv.appendChild(div);
            });
        }
    }

    async function addFriendById() {
        const targetId = document.getElementById('friendIdInput').value.trim();
        if (!targetId) return alert('Введите ID друга!');

        const res = await fetch('/api/add-friend-by-id', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: currentUser, targetId })
        });
        const data = await res.json();
        if (data.success) {
            dbData = data.db;
            document.getElementById('friendIdInput').value = '';
            alert(`Пользователь ${data.friendName} добавлен в друзья!`);
            updateTabContent();
        } else {
            alert(data.error || 'Ошибка добавления');
        }
    }

    function selectPartner(user) {
        currentPartner = user;
        document.getElementById('contentTitle').textContent = user === currentUser ? '⭐ Избранное (Заметки)' : `Чат с: ${user}`;
        document.getElementById('chatContainer').classList.remove('hidden');
        renderMessages();
    }

    function renderMessages() {
        const messagesBox = document.getElementById('messagesBox');
        messagesBox.innerHTML = '';
        const chatHistory = dbData.messagesStore?.[currentUser]?.[currentPartner] || [];
        
        if (chatHistory.length === 0) {
            messagesBox.innerHTML = '<i style="color:#45a29e;">История пуста. Напишите что-нибудь!</i>';
            return;
        }

        chatHistory.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.sender === currentUser && currentPartner !== currentUser ? 'me' : 'other'}`;
            div.innerHTML = `<b>${m.sender}:</b> ${m.text} <br><small style="font-size:10px; color:#888;">${m.time}</small>`;
            messagesBox.appendChild(div);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    function renderNews() {
        const newsList = document.getElementById('newsList');
        newsList.innerHTML = '';
        if (googleNews.length === 0) {
            newsList.innerHTML = 'Загрузка...';
            return;
        }
        googleNews.forEach(n => {
            const a = document.createElement('a');
            a.className = 'news-item';
            a.href = n.link;
            a.target = '_blank';
            a.innerHTML = `<b>${n.date}</b><br>${n.title}`;
            newsList.appendChild(a);
        });
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !currentPartner) return;

        const res = await fetch('/api/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, receiver: currentPartner, text })
        });
        const data = await res.json();
        dbData = data.db;
        input.value = '';
        renderMessages();
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
