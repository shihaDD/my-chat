<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>В Одно Ебло</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-color: #0d0e15;
      --panel-bg: #161925;
      --accent-color: #00ffcc;
      --accent-hover: #00b38f;
      --text-color: #e0e6ed;
      --text-muted: #8a99ad;
      --border-color: #2a2f45;
      --neon-glow: 0 0 10px rgba(0, 255, 204, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      overflow: hidden;
    }

    /* Авторизация */
    #auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: radial-gradient(circle, #1a1f35 0%, #0d0e15 100%);
    }

    .auth-card {
      background: var(--panel-bg);
      padding: 40px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: var(--neon-glow);
      width: 350px;
      text-align: center;
    }

    .auth-card h2 {
      margin-bottom: 20px;
      color: var(--accent-color);
    }

    .auth-card input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
    }

    .auth-card button {
      width: 100%;
      padding: 12px;
      background: var(--accent-color);
      color: var(--bg-color);
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .auth-card button:hover {
      background: var(--accent-hover);
      box-shadow: var(--neon-glow);
    }

    .toggle-auth {
      margin-top: 15px;
      font-size: 14px;
      color: var(--text-muted);
      cursor: pointer;
    }

    /* Главное приложение */
    #app-screen {
      display: none;
      height: 100vh;
      display: grid;
      grid-template-columns: 280px 1fr 350px;
    }

    /* Левая панель (друзья и навигация) */
    .sidebar-left {
      background: var(--panel-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
      font-size: 18px;
      font-weight: bold;
      color: var(--accent-color);
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border-color);
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .tab-btn.active {
      color: var(--accent-color);
      border-bottom: 2px solid var(--accent-color);
      background: rgba(0, 255, 204, 0.05);
    }

    .tab-content {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
    }

    .user-item {
      padding: 10px;
      margin-bottom: 8px;
      background: var(--bg-color);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid transparent;
      transition: 0.2s;
    }

    .user-item:hover {
      border-color: var(--accent-color);
    }

    /* Центральная панель (Чат или Лента) */
    .center-panel {
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: var(--bg-color);
      position: relative;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .message {
      background: var(--panel-bg);
      padding: 12px 16px;
      border-radius: 8px;
      max-width: 70%;
      border: 1px solid var(--border-color);
    }

    .message .sender {
      font-size: 12px;
      color: var(--accent-color);
      margin-bottom: 4px;
    }

    .message img {
      max-width: 100%;
      border-radius: 6px;
      margin-top: 8px;
    }

    /* Индикатор печати / отправки фото */
    #typing-indicator {
      padding: 5px 20px;
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      height: 24px;
    }

    .chat-input-area {
      padding: 15px 20px;
      background: var(--panel-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .chat-input-area input[type="text"] {
      flex: 1;
      padding: 10px 15px;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-color);
    }

    .chat-input-area label {
      cursor: pointer;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .chat-input-area label:hover {
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .chat-input-area input[type="file"] {
      display: none;
    }

    .chat-input-area button {
      padding: 10px 20px;
      background: var(--accent-color);
      color: var(--bg-color);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Лента Мемов и TikTok (Изолированный бесконечный скролл + Синхронизация) */
    .feed-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
      height: 100vh; /* Строго фиксированная высота для изоляции скролла */
    }

    .feed-item {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      width: 100%;
      max-width: 450px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .feed-media {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      display: block;
    }

    .feed-footer {
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Правая панель (Профиль друга или Управление рацией) */
    .sidebar-right {
      background: var(--panel-bg);
      border-left: 1px solid var(--border-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      height: 100vh;
      overflow-y: auto;
    }

    .profile-card {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .profile-card h3 {
      color: var(--accent-color);
      margin-bottom: 15px;
    }

    .profile-card input {
      width: 100%;
      padding: 8px;
      margin: 10px 0;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      border-radius: 4px;
    }

    .profile-card button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: var(--accent-color);
      color: var(--bg-color);
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    .ptt-section {
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      padding: 15px;
      border-radius: 8px;
    }

    .ptt-button {
      width: 100%;
      padding: 15px;
      background: #ff3366;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
      text-transform: uppercase;
    }

    .ptt-button.active {
      background: #00ffcc;
      color: #0d0e15;
      box-shadow: var(--neon-glow);
    }
  </style>
</head>
<body>

  <!-- Экран авторизации -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2 id="auth-title">Вход</h2>
      <input type="text" id="username" placeholder="Имя пользователя">
      <input type="password" id="password" placeholder="Пароль">
      <button id="auth-submit-btn" onclick="handleAuth()">Войти</button>
      <div class="toggle-auth" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</div>
    </div>
  </div>

  <!-- Главный экран приложения -->
  <div id="app-screen">
    <!-- Левая панель: Вкладки (Чаты / Друзья) -->
    <div class="sidebar-left">
      <div class="sidebar-header" id="current-user-display">Профиль</div>
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('chats')">Чаты</button>
        <button class="tab-btn" onclick="switchTab('friends')">Друзья</button>
        <button class="tab-btn" onclick="switchTab('feed')">Лента</button>
      </div>
      <div class="tab-content" id="tab-content-area">
        <!-- Контент динамически переключается -->
      </div>
    </div>

    <!-- Центральная панель -->
    <div class="center-panel" id="center-main-area">
      <div class="chat-messages" id="chat-messages">
        <!-- Сообщения чата -->
      </div>
      <div id="typing-indicator"></div>
      <div class="chat-input-area" id="chat-input-container">
        <input type="text" id="message-input" placeholder="Введите сообщение..." oninput="onUserTypingInput()">
        <label title="Отправить фото">
          📷
          <input type="file" id="photo-file-input" accept="image/*" onchange="handlePhotoUpload(event)">
        </label>
        <button onclick="sendMessage()">Отправить</button>
      </div>
    </div>

    <!-- Правая панель: Профиль выбранного человека / Рация -->
    <div class="sidebar-right">
      <div class="profile-card" id="right-profile-panel">
        <h3>Профиль</h3>
        <p style="color: var(--text-muted); font-size: 14px;">Выберите пользователя во вкладке «Друзья», чтобы открыть его профиль здесь.</p>
      </div>

      <div class="ptt-section">
        <h3>Рация (Push-to-Talk)</h3>
        <p id="ptt-hint" style="font-size: 12px; color: var(--accent-color); margin-top: 5px;">Активная кнопка: Левая кнопка мыши (ЛКМ) или кнопка ниже</p>
        <button class="ptt-button" id="ptt-btn" onmousedown="startPTT()" onmouseup="stopPTT()">Удерживайте для речи</button>
        <button style="width:100%; margin-top:8px; padding:8px; background:var(--border-color); color:var(--text-color); border:none; border-radius:4px; cursor:pointer;" onclick="bindMouseKey()">Привязать кнопку мыши</button>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let isRegisterMode = false;
    let currentUser = null;
    let currentActiveTab = 'chats';
    let selectedProfileUser = null;
    let currentFeedItems = [];
    let boundMouseKeyName = 'Левая кнопка мыши (ЛКМ)';
    let isBindingKey = false;
    let typingTimer = null;

    function toggleAuthMode() {
      isRegisterMode = !isRegisterMode;
      document.getElementById('auth-title').innerText = isRegisterMode ? 'Регистрация' : 'Вход';
      document.getElementById('auth-submit-btn').innerText = isRegisterMode ? 'Зарегистрироваться' : 'Войти';
      document.querySelector('.toggle-auth').innerText = isRegisterMode ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    }

    async function handleAuth() {
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!username || !password) return alert('Заполните все поля!');

      const endpoint = isRegisterMode ? '/api/register' : '/api/login';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);

        currentUser = data.username;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'grid';
        document.getElementById('current-user-display').innerText = currentUser;

        initSocket();
      } catch (err) {
        alert('Ошибка соединения с сервером');
      }
    }

    function initSocket() {
      socket = io();

      socket.emit('auth', { username: currentUser });

      socket.on('init_data', (data) => {
        renderMessages(data.messages);
        currentFeedItems = data.feed;
        renderTabContent(data.users);
      });

      socket.on('users_list', (users) => {
        renderTabContent(users);
      });

      socket.on('chat_message', (msg) => {
        appendMessage(msg);
      });

      socket.on('user_typing', (data) => {
        const indicator = document.getElementById('typing-indicator');
        if (data.active) {
          if (data.type === 'photo') {
            indicator.innerText = `${data.username} отправляет фото...`;
          } else {
            indicator.innerText = `${data.username} печатает...`;
          }
        } else {
          indicator.innerText = '';
        }
      });

      socket.on('feed_updated', (feed) => {
        currentFeedItems = feed;
        if (currentActiveTab === 'feed') {
          renderFeedContent();
        }
      });

      socket.on('custom_name_updated', (data) => {
        alert(`Псевдоним для ${data.targetUser} успешно обновлен!`);
      });
    }

    function switchTab(tab) {
      currentActiveTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');

      const centerArea = document.getElementById('center-main-area');
      if (tab === 'feed') {
        centerArea.innerHTML = `
          <div class="feed-container" id="feed-container" onscroll="checkFeedScroll()">
            <!-- Лента мемов и TikTok -->
          </div>
        `;
        renderFeedContent();
      } else {
        centerArea.innerHTML = `
          <div class="chat-messages" id="chat-messages"></div>
          <div id="typing-indicator"></div>
          <div class="chat-input-area" id="chat-input-container">
            <input type="text" id="message-input" placeholder="Введите сообщение..." oninput="onUserTypingInput()">
            <label title="Отправить фото">
              📷
              <input type="file" id="photo-file-input" accept="image/*" onchange="handlePhotoUpload(event)">
            </label>
            <button onclick="sendMessage()">Отправить</button>
          </div>
        `;
        // Запросим свежие сообщения
      }
    }

    function renderTabContent(usersList) {
      const container = document.getElementById('tab-content-area');
      container.innerHTML = '';

      if (currentActiveTab === 'chats') {
        container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">Общий чат активен в центре.</p>';
      } else if (currentActiveTab === 'friends') {
        usersList.forEach(u => {
          if (u.username === currentUser) return;
          const div = document.createElement('div');
          div.className = 'user-item';
          div.innerHTML = `
            <span>${u.customName}</span>
            <button style="padding:4px 8px; background:var(--accent-color); border:none; border-radius:4px; cursor:pointer;" onclick="selectFriendProfile('${u.username}', '${u.customName}')">Профиль</button>
          `;
          container.appendChild(div);
        });
      } else if (currentActiveTab === 'feed') {
        container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">Совместный скролл активен в центре.</p>';
      }
    }

    // 2. Открытие профиля человека справа
    function selectFriendProfile(username, customName) {
      selectedProfileUser = username;
      const rightPanel = document.getElementById('right-profile-panel');
      rightPanel.innerHTML = `
        <h3>Профиль: ${customName}</h3>
        <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">Логин: ${username}</p>
        <label style="font-size:12px; text-align:left; display:block; color:var(--text-muted);">Изменить имя/псевдоним:</label>
        <input type="text" id="custom-name-input" value="${customName}">
        <button onclick="saveCustomName('${username}')">Сохранить псевдоним</button>
        <button style="background:#00ffcc; color:#0d0e15;" onclick="startCall('${username}')">Позвонить</button>
        <button style="background:#3366ff; color:#fff;" onclick="openDirectChat('${username}')">Написать</button>
      `;
    }

    function saveCustomName(targetUser) {
      const val = document.getElementById('custom-name-input').value.trim();
      socket.emit('set_custom_name', { targetUser, customName: val });
    }

    function startCall(username) {
      alert(`Инициирован звонок пользователю ${username}...`);
    }

    function openDirectChat(username) {
      alert(`Открыт чат с ${username}`);
      switchTab('chats');
    }

    // 1. Индикатор печати / отправки фото
    function onUserTypingInput() {
      socket.emit('typing_status', { type: 'typing', active: true });
      clearTimeout(typingTimer);
      typingTimer = setTimeout(() => {
        socket.emit('typing_status', { type: 'typing', active: false });
      }, 1500);
    }

    function handlePhotoUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      socket.emit('typing_status', { type: 'photo', active: true });

      const reader = new FileReader();
      reader.onload = function(e) {
        socket.emit('chat_message', { text: '', image: e.target.result });
        socket.emit('typing_status', { type: 'photo', active: false });
      };
      reader.readAsDataURL(file);
    }

    function sendMessage() {
      const input = document.getElementById('message-input');
      const text = input.value.trim();
      if (!text) return;

      socket.emit('chat_message', { text, image: null });
      input.value = '';
      socket.emit('typing_status', { type: 'typing', active: false });
    }

    function appendMessage(msg) {
      const chatContainer = document.getElementById('chat-messages');
      if (!chatContainer) return;

      const div = document.createElement('div');
      div.className = 'message';
      div.innerHTML = `
        <div class="sender">${msg.sender} <span style="float:right; color:var(--text-muted);">${msg.timestamp}</span></div>
        <div>${msg.text}</div>
        ${msg.image ? `<img src="${msg.image}" alt="photo">` : ''}
      `;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function renderMessages(messages) {
      const chatContainer = document.getElementById('chat-messages');
      if (!chatContainer) return;
      chatContainer.innerHTML = '';
      messages.forEach(m => appendMessage(m));
    }

    // 3 & 4. Совместный и бесконечный скролл ленты TikTok
    function renderFeedContent() {
      const container = document.getElementById('feed-container');
      if (!container) return;

      container.innerHTML = '';
      currentFeedItems.forEach(item => {
        const div = document.createElement('div');
        div.className = 'feed-item';
        div.innerHTML = `
          ${item.type === 'video' 
            ? `<video class="feed-media" src="${item.url}" controls loop></video>`
            : `<img class="feed-media" src="${item.url}" alt="meme">`
          }
          <div class="feed-footer">
            <span>${item.caption}</span>
            <button onclick="likeFeedItem(${item.id})" style="background:none; border:none; color:var(--accent-color); cursor:pointer;">❤️ ${item.likes}</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function checkFeedScroll() {
      const container = document.getElementById('feed-container');
      if (!container) return;
      // Если прокрутили до низа — запрашиваем новые элементы для бесконечного скролла
      if (container.scrollTop + container.clientHeight >= container.scrollHeight - 50) {
        socket.emit('load_more_feed');
      }
    }

    function likeFeedItem(itemId) {
      socket.emit('like_feed_item', { itemId });
    }

    // 5. Привязка мыши к рации и актуальная подсказка
    function bindMouseKey() {
      isBindingKey = true;
      const hint = document.getElementById('ptt-hint');
      hint.innerText = 'Нажмите любую кнопку мыши для привязки...';

      window.addEventListener('mousedown', function mouseListener(e) {
        if (!isBindingKey) return;
        isBindingKey = false;
        
        let buttonName = 'Левая кнопка мыши (ЛКМ)';
        if (e.button === 1) buttonName = 'Средняя кнопка мыши (СКМ)';
        if (e.button === 2) buttonName = 'Правая кнопка мыши (ПКМ)';
        if (e.button > 2) buttonName = `Кнопка мыши #${e.button + 1}`;

        boundMouseKeyName = buttonName;
        hint.innerText = `Активная кнопка: ${boundMouseKeyName}`;
        window.removeEventListener('mousedown', mouseListener);
      }, { once: true });
    }

    function startPTT() {
      const btn = document.getElementById('ptt-btn');
      btn.classList.add('active');
      btn.innerText = 'Передача речи...';
    }

    function stopPTT() {
      const btn = document.getElementById('ptt-btn');
      btn.classList.remove('active');
      btn.innerText = 'Удерживайте для речи';
    }
  </script>
</body>
</html>
