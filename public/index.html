<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>В Одно Ебло</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    :root {
      --bg-main: #0c0d14;
      --bg-panel: #141622;
      --bg-card: #1c1f2e;
      --accent: #00ffcc;
      --accent-hover: #00b38f;
      --text: #e2e8f0;
      --text-muted: #8c9bae;
      --border: #262c40;
      --neon: 0 0 12px rgba(0, 255, 204, 0.25);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text); height: 100vh; overflow: hidden; }

    #auth-container {
      display: flex; justify-content: center; align-items: center; height: 100vh;
      background: radial-gradient(circle, #181d32 0%, #0c0d14 100%);
    }
    .auth-box {
      background: var(--bg-panel); padding: 40px; border-radius: 12px; border: 1px solid var(--border);
      box-shadow: var(--neon); width: 360px; text-align: center;
    }
    .auth-box h2 { margin-bottom: 25px; color: var(--accent); }
    .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    .auth-box button { width: 100%; padding: 12px; background: var(--accent); color: var(--bg-main); font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
    .auth-switch { margin-top: 15px; font-size: 14px; color: var(--text-muted); cursor: pointer; }

    #app-container { display: none; height: 100vh; display: grid; grid-template-columns: 280px 1fr 340px; }
    .left-sidebar { background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
    .app-logo { padding: 20px; font-size: 18px; font-weight: bold; color: var(--accent); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .nav-tabs { display: flex; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg-main); }
    .tab-btn { flex: 1 1 50%; padding: 10px 4px; background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 11px; font-weight: 600; text-align: center; }
    .tab-btn.active { color: var(--accent); border-bottom: 2px solid var(--accent); background: rgba(0, 255, 204, 0.05); }
    .tab-body { flex: 1; overflow-y: auto; padding: 15px; }

    .user-card { padding: 10px; margin-bottom: 8px; background: var(--bg-card); border-radius: 6px; display: flex; justify-content: space-between; align-items: center; border: 1px solid transparent; }
    .user-card:hover { border-color: var(--accent); }

    .center-area { display: flex; flex-direction: column; height: 100vh; background: var(--bg-main); }
    .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .chat-message { background: var(--bg-panel); padding: 12px 16px; border-radius: 8px; max-width: 70%; border: 1px solid var(--border); }
    .chat-message .author { font-size: 12px; color: var(--accent); margin-bottom: 4px; }
    .chat-message img { max-width: 100%; border-radius: 6px; margin-top: 8px; }
    #typing-status-bar { padding: 4px 20px; font-size: 13px; color: var(--text-muted); font-style: italic; height: 24px; }
    .chat-controls { padding: 15px 20px; background: var(--bg-panel); border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: center; }
    .chat-controls input[type="text"] { flex: 1; padding: 10px 15px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
    .chat-controls label { cursor: pointer; background: var(--bg-main); border: 1px solid var(--border); padding: 10px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .chat-controls input[type="file"] { display: none; }
    .chat-controls button { padding: 10px 20px; background: var(--accent); color: var(--bg-main); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

    .right-sidebar { background: var(--bg-panel); border-left: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; height: 100vh; overflow-y: auto; }
    .panel-box { background: var(--bg-main); border: 1px solid var(--border); padding: 15px; border-radius: 8px; }
    .panel-box h3 { color: var(--accent); margin-bottom: 12px; font-size: 16px; }
    .panel-box input, .panel-box select { width: 100%; padding: 8px; margin: 8px 0; background: var(--bg-panel); border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
    .panel-box button { width: 100%; padding: 10px; margin-top: 6px; background: var(--accent); color: var(--bg-main); border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }

    #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); justify-content: center; align-items: center; z-index: 1000; }
    .settings-content { background: var(--bg-panel); border: 1px solid var(--border); padding: 30px; border-radius: 12px; width: 420px; box-shadow: var(--neon); }
    .settings-content h3 { color: var(--accent); margin-bottom: 15px; }
  </style>
</head>
<body>

  <div id="auth-container">
    <div class="auth-box">
      <h2 id="auth-title">Вход</h2>
      <input type="text" id="username-input" placeholder="Логин">
      <input type="password" id="password-input" placeholder="Пароль">
      <button id="auth-btn" onclick="performAuth()">Войти</button>
      <div class="auth-switch" onclick="switchAuthMode()">Нет аккаунта? Зарегистрироваться</div>
    </div>
  </div>

  <div id="settings-modal">
    <div class="settings-content">
      <h3>Настройки аудиоустройств</h3>
      <button onclick="requestMicrophonePermission()" style="background:#ff3366; color:#fff; margin-bottom:15px;">🔒 Разрешить доступ к микрофону</button>
      
      <label style="font-size:12px; color:var(--text-muted);">Микрофон:</label>
      <select id="mic-select"><option value="">Запросите доступ к микрофону...</option></select>
      
      <label style="font-size:12px; color:var(--text-muted); margin-top:10px; display:block;">Наушники / Динамики:</label>
      <select id="speaker-select"><option value="">Вывод звука (Динамики)</option></select>

      <button onclick="toggleSettingsModal()" style="margin-top:20px; background:var(--accent);">Закрыть</button>
    </div>
  </div>

  <div id="app-container">
    <div class="left-sidebar">
      <div class="app-logo">
        <span id="current-username-view">Профиль</span>
        <button onclick="toggleSettingsModal()" style="background:none; border:none; color:var(--accent); cursor:pointer; font-size:18px;" title="Настройки">⚙</button>
      </div>
      <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchAppTab('chats')">Чаты</button>
        <button class="tab-btn" onclick="switchAppTab('friends')">Друзья</button>
        <button class="tab-btn" onclick="switchAppTab('communities')">Сообщества</button>
        <button class="tab-btn" onclick="switchAppTab('feed')">Лента</button>
      </div>
      <div class="tab-body" id="left-tab-content"></div>
    </div>

    <div class="center-area" id="center-dynamic-area">
      <div class="chat-box" id="chat-messages-box"></div>
      <div id="typing-status-bar"></div>
      <div class="chat-controls">
        <input type="text" id="chat-text-input" placeholder="Введите сообщение..." oninput="emitTypingEvent()">
        <label title="Отправить фото">📷<input type="file" id="photo-picker" accept="image/*" onchange="sendPhotoFile(event)"></label>
        <button onclick="sendChatMessage()">Отправить</button>
      </div>
    </div>

    <div class="right-sidebar">
      <div class="panel-box" id="right-profile-box">
        <h3>Профиль</h3>
        <p style="color: var(--text-muted); font-size: 13px;">Выберите пользователя или сообщество для управления.</p>
      </div>
    </div>
  </div>

  <script>
    let socket;
    let isReg = false;
    let myUser = null;
    let activeTab = 'chats';
    let usersCache = [];
    let communitiesCache = [];
    let typingTimeout = null;
    let localStream = null;
    let peerConnection = null;

    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function switchAuthMode() {
      isReg = !isReg;
      document.getElementById('auth-title').innerText = isReg ? 'Регистрация' : 'Вход';
      document.getElementById('auth-btn').innerText = isReg ? 'Зарегистрироваться' : 'Войти';
      document.querySelector('.auth-switch').innerText = isReg ? 'Уже есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
    }

    async function performAuth() {
      const username = document.getElementById('username-input').value.trim();
      const password = document.getElementById('password-input').value.trim();
      if (!username || !password) return alert('Заполните все поля!');

      const endpoint = isReg ? '/api/register' : '/api/login';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (data.error) return alert(data.error);

        myUser = data.username;
        document.getElementById('auth-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'grid';
        document.getElementById('current-username-view').innerText = myUser;

        setupSocket();
      } catch (err) {
        alert('Ошибка связи с сервером');
      }
    }

    function setupSocket() {
      socket = io();
      socket.emit('auth', { username: myUser });

      socket.on('init_data', (data) => {
        renderChatMessages(data.messages);
        communitiesCache = data.communities;
      });

      socket.on('users_list', (users) => {
        usersCache = users;
        renderLeftTab();
      });

      socket.on('communities_updated', (comms) => {
        communitiesCache = comms;
        if (activeTab === 'communities') renderLeftTab();
      });

      socket.on('community_joined', (commData) => {
        renderCommunityDetails(commData);
      });

      socket.on('chat_message', (msg) => {
        appendChatMessage(msg);
      });

      socket.on('user_typing', (data) => {
        const statusElem = document.getElementById('typing-status-bar');
        if (statusElem) {
          statusElem.innerText = data.active ? `${data.username} печатает...` : '';
        }
      });

      // WebRTC Сигнализация для звонков
      socket.on('webrtc_offer', async ({ offer, sender }) => {
        if (!confirm(`Входящий звонок от пользователя ${sender}. Принять?`)) return;
        await requestMicrophonePermission();
        peerConnection = new RTCPeerConnection(rtcConfig);
        if (localStream) localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

        peerConnection.onicecandidate = e => {
          if (e.candidate) socket.emit('webrtc_ice_candidate', { candidate: e.candidate, target: sender });
        };
        peerConnection.ontrack = e => {
          const audioElem = new Audio();
          audioElem.srcObject = e.streams[0];
          audioElem.autoplay = true;
          const speakerId = document.getElementById('speaker-select').value;
          if (speakerId && audioElem.setSinkId) audioElem.setSinkId(speakerId);
        };

        await peerConnection.setRemoteDescription(new RTCSessionDescription(offer));
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        socket.emit('webrtc_answer', { answer, target: sender });
      });

      socket.on('webrtc_answer', async ({ answer }) => {
        if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
      });

      socket.on('webrtc_ice_candidate', async ({ candidate }) => {
        if (peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
      });
    }

    async function requestMicrophonePermission() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
        alert('Доступ к микрофону успешно разрешен!');
        await loadAudioDevices();
      } catch (err) {
        alert('Не удалось получить доступ к микрофону: ' + err.message);
      }
    }

    async function loadAudioDevices() {
      if (!navigator.mediaDevices?.enumerateDevices) return;
      const devices = await navigator.mediaDevices.enumerateDevices();
      const micSelect = document.getElementById('mic-select');
      const speakerSelect = document.getElementById('speaker-select');
      micSelect.innerHTML = '';
      speakerSelect.innerHTML = '';

      devices.forEach(device => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `${device.kind} (${device.deviceId.slice(0, 5)}...)`;
        if (device.kind === 'audioinput') micSelect.appendChild(option);
        if (device.kind === 'audiooutput') speakerSelect.appendChild(option);
      });
    }

    function switchAppTab(tab) {
      activeTab = tab;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderLeftTab();
    }

    function renderLeftTab() {
      const container = document.getElementById('left-tab-content');
      if (!container) return;
      container.innerHTML = '';

      if (activeTab === 'chats') {
        container.innerHTML = '<p style="color:var(--text-muted); font-size:13px;">Общий чат активен.</p>';
      } else if (activeTab === 'friends') {
        container.innerHTML = '<h4 style="font-size:12px; color:var(--accent); margin-bottom:8px;">Ваши друзья</h4>';
        usersCache.filter(u => u.isFriend && u.username !== myUser).forEach(u => {
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `<span>${u.customName}</span><button style="padding:4px 8px; background:var(--accent); border:none; border-radius:4px; cursor:pointer;" onclick="openUserProfile('${u.username}', '${u.customName}')">Профиль</button>`;
          container.appendChild(div);
        });

        container.innerHTML += '<h4 style="font-size:12px; color:var(--accent); margin:15px 0 8px 0;">Входящие заявки</h4>';
        usersCache.filter(u => u.hasIncoming).forEach(u => {
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `<span>${u.username}</span><button style="padding:4px 8px; background:var(--accent); border:none; border-radius:4px; cursor:pointer;" onclick="acceptRequest('${u.username}')">Принять</button>`;
          container.appendChild(div);
        });

        container.innerHTML += '<h4 style="font-size:12px; color:var(--accent); margin:15px 0 8px 0;">Пользователи</h4>';
        usersCache.filter(u => u.username !== myUser && !u.isFriend && !u.hasIncoming && !u.hasOutgoing).forEach(u => {
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `<span>${u.username}</span><button style="padding:4px 8px; background:var(--border); color:var(--text); border:none; border-radius:4px; cursor:pointer;" onclick="sendFriendRequest('${u.username}')">Добавить</button>`;
          container.appendChild(div);
        });
      } else if (activeTab === 'communities') {
        container.innerHTML = `
          <input type="text" id="new-comm-name" placeholder="Название сообщества..." style="width:100%; padding:8px; margin-bottom:8px; background:var(--bg-main); border:1px solid var(--border); color:var(--text); border-radius:4px;">
          <button onclick="createCommunity()" style="width:100%; padding:8px; background:var(--accent); color:var(--bg-main); border:none; border-radius:4px; font-weight:bold; margin-bottom:15px; cursor:pointer;">Создать сообщество</button>
          <h4 style="font-size:12px; color:var(--accent); margin-bottom:8px;">Список сообществ</h4>
        `;
        communitiesCache.forEach(comm => {
          const div = document.createElement('div');
          div.className = 'user-card';
          div.innerHTML = `<span>${comm.name} (${comm.membersCount})</span><button style="padding:4px 8px; background:var(--accent); border:none; border-radius:4px; cursor:pointer;" onclick="openCommunity('${comm.id}')">Открыть</button>`;
          container.appendChild(div);
        });
      }
    }

    function sendFriendRequest(targetUser) { socket.emit('send_friend_request', { targetUser }); }
    function acceptRequest(targetUser) { socket.emit('accept_friend_request', { targetUser }); }

    function createCommunity() {
      const name = document.getElementById('new-comm-name').value.trim();
      if (!name) return;
      socket.emit('create_community', { name });
    }

    function openCommunity(communityId) {
      socket.emit('get_community_details', { communityId });
    }

    function renderCommunityDetails(comm) {
      const rightBox = document.getElementById('right-profile-box');
      let membersHtml = '';
      let isCreator = comm.creator === myUser;

      comm.members.forEach(m => {
        let roleBadge = m.role === 'creator' ? '👑 Создатель' : (m.role === 'admin' ? '🛡 Админ' : '👤 Участник');
        let roleAction = '';
        if (isCreator && m.username !== myUser) {
          if (m.role === 'member') {
            roleAction = `<button style="padding:2px 6px; background:var(--accent); border:none; border-radius:4px; font-size:10px; cursor:pointer;" onclick="setMemberRole('${comm.id}', '${m.username}', 'admin')">Сделать админом</button>`;
          } else {
            roleAction = `<button style="padding:2px 6px; background:var(--border); border:none; border-radius:4px; font-size:10px; color:var(--text); cursor:pointer;" onclick="setMemberRole('${comm.id}', '${m.username}', 'member')">Снять админа</button>`;
          }
        }
        membersHtml += `<div style="display:flex; justify-content:space-between; align-items:center; margin:6px 0; font-size:12px;"><span>${m.username} (${roleBadge})</span> ${roleAction}</div>`;
      });

      rightBox.innerHTML = `
        <h3>Сообщество: ${comm.name}</h3>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Создатель: ${comm.creator}</p>
        <h4 style="font-size:13px; color:var(--accent); margin-bottom:6px;">Участники:</h4>
        ${membersHtml}
        <button style="background:var(--accent); margin-top:10px;" onclick="joinCommunity('${comm.id}')">Вступить / Обновить</button>
        <button style="background:#ff3366; color:#fff;" onclick="leaveCommunity('${comm.id}')">${isCreator ? 'Удалить сообщество' : 'Выйти'}</button>
      `;
    }

    function joinCommunity(communityId) { socket.emit('join_community', { communityId }); }
    function leaveCommunity(communityId) { socket.emit('leave_community', { communityId }); document.getElementById('right-profile-box').innerHTML = '<h3>Профиль</h3><p style="color:var(--text-muted); font-size:13px;">Выберите объект управления.</p>'; }
    function setMemberRole(communityId, targetUser, newRole) { socket.emit('set_member_role', { communityId, targetUser, newRole }); }

    function openUserProfile(username, customName) {
      document.getElementById('right-profile-box').innerHTML = `
        <h3>Профиль: ${customName}</h3>
        <p style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">Аккаунт: ${username}</p>
        <label style="font-size:12px; color:var(--text-muted);">Псевдоним:</label>
        <input type="text" id="edit-custom-name" value="${customName}">
        <button onclick="saveUserAlias('${username}')">Сохранить</button>
        <button style="background:var(--accent); color:var(--bg-main);" onclick="callUser('${username}')">📞 Позвонить</button>
      `;
    }

    function saveUserAlias(targetUser) {
      const val = document.getElementById('edit-custom-name').value.trim();
      socket.emit('set_custom_name', { targetUser, customName: val });
    }

    async function callUser(username) {
      if (!localStream) await requestMicrophonePermission();
      if (!localStream) return alert('Для звонка нужен микрофон!');

      peerConnection = new RTCPeerConnection(rtcConfig);
      localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

      peerConnection.onicecandidate = e => {
        if (e.candidate) socket.emit('webrtc_ice_candidate', { candidate: e.candidate, target: username });
      };
      peerConnection.ontrack = e => {
        const audioElem = new Audio();
        audioElem.srcObject = e.streams[0];
        audioElem.autoplay = true;
        const speakerId = document.getElementById('speaker-select').value;
        if (speakerId && audioElem.setSinkId) audioElem.setSinkId(speakerId);
      };

      const offer = await peerConnection.createOffer();
      await peerConnection.setLocalDescription(offer);
      socket.emit('webrtc_offer', { offer, target: username });
      alert(`Звонок пользователю ${username} отправлен...`);
    }

    function toggleSettingsModal() {
      const modal = document.getElementById('settings-modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
    }

    function emitTypingEvent() {
      socket.emit('typing_status', { active: true });
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(() => socket.emit('typing_status', { active: false }), 1500);
    }

    function sendPhotoFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        socket.emit('chat_message', { text: '', image: evt.target.result });
      };
      reader.readAsDataURL(file);
    }

    function sendChatMessage() {
      const input = document.getElementById('chat-text-input');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chat_message', { text, image: null });
      input.value = '';
    }

    function appendChatMessage(msg) {
      const box = document.getElementById('chat-messages-box');
      if (!box) return;
      const div = document.createElement('div');
      div.className = 'chat-message';
      div.innerHTML = `
        <div class="author">${msg.sender} <span style="float:right; color:var(--text-muted);">${msg.timestamp}</span></div>
        <div>${msg.text}</div>
        ${msg.image ? `<img src="${msg.image}" alt="img">` : ''}
      `;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function renderChatMessages(messages) {
      const box = document.getElementById('chat-messages-box');
      if (!box) return;
      box.innerHTML = '';
      messages.forEach(m => appendChatMessage(m));
    }
  </script>
</body>
</html>
