<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В Одно Ебло</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0b0c10; 
            color: #c5c6c7;
            margin: 0; 
            padding: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
        }
        .container { 
            width: 100%; 
            max-width: 850px; 
            background: #1f2833; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 0 20px rgba(102, 252, 241, 0.2); 
            border: 1px solid #66fcf1;
            height: 520px; 
            display: flex; 
            flex-direction: column; 
        }
        .hidden { display: none !important; }
        
        /* Авторизация */
        #auth-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; }
        .auth-box { width: 340px; display: flex; flex-direction: column; gap: 14px; }
        .auth-box h3 { text-align: center; margin-bottom: 5px; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(102, 252, 241, 0.5); }
        
        input, button { 
            padding: 12px; 
            font-size: 15px; 
            border: 1px solid #45a29e; 
            border-radius: 6px; 
            outline: none; 
            background: #0b0c10;
            color: #fff;
        }
        input:focus { border-color: #66fcf1; box-shadow: 0 0 8px rgba(102, 252, 241, 0.6); }
        
        button { 
            background: #45a29e; 
            color: #0b0c10; 
            border: none; 
            cursor: pointer; 
            font-weight: bold; 
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.2s; 
        }
        button:hover { background: #66fcf1; box-shadow: 0 0 12px #66fcf1; }

        /* Модальное окно для кода */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(11, 12, 16, 0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; }
        .modal { background: #1f2833; padding: 30px; border-radius: 12px; width: 340px; border: 1px solid #66fcf1; box-shadow: 0 0 25px rgba(102, 252, 241, 0.4); text-align: center; }
        .modal h3 { margin-top: 0; color: #66fcf1; }
        .modal p { color: #c5c6c7; font-size: 14px; margin-bottom: 20px; }
        .code-input { font-size: 24px; text-align: center; letter-spacing: 12px; width: 80%; margin-bottom: 15px; background: #0b0c10; color: #66fcf1; border: 1px solid #45a29e; }
        .debug-hint { font-size: 12px; color: #ff007f; background: rgba(255, 0, 127, 0.1); border: 1px solid #ff007f; padding: 8px; border-radius: 4px; margin-bottom: 15px; }

        /* Основной интерфейс соцсети */
        .app-content { display: flex; gap: 20px; height: 100%; }
        .sidebar { width: 32%; border-right: 1px solid #45a29e; padding-right: 15px; display: flex; flex-direction: column; }
        .users-list { overflow-y: auto; flex-grow: 1; margin-top: 10px; }
        .user-item { padding: 10px; cursor: pointer; border-radius: 6px; margin-bottom: 6px; background: #0b0c10; border: 1px solid transparent; transition: all 0.2s; color: #c5c6c7; }
        .user-item:hover, .user-item.active { border-color: #66fcf1; color: #66fcf1; background: rgba(102, 252, 241, 0.05); }
        
        .chat-area { width: 68%; display: flex; flex-direction: column; height: 100%; }
        .messages { flex-grow: 1; border: 1px solid #45a29e; border-radius: 8px; padding: 15px; overflow-y: auto; margin-bottom: 12px; background: #0b0c10; }
        .msg { margin-bottom: 10px; padding: 8px 12px; border-radius: 8px; max-width: 75%; word-break: break-word; color: #fff; }
        .msg.me { background: rgba(102, 252, 241, 0.15); border: 1px solid #66fcf1; margin-left: auto; text-align: right; }
        .msg.other { background: #1f2833; border: 1px solid #45a29e; }
        .send-panel { display: flex; gap: 10px; }
        .send-panel input { flex-grow: 1; }
        
        h4 { color: #66fcf1; }
        b { color: #66fcf1; }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭКРАН ВХОДА -->
    <div id="auth-screen">
        <div class="auth-box">
            <h3>В Одно Ебло</h3>
            <input type="text" id="nameInput" placeholder="Твое имя...">
            <input type="text" id="phoneInput" placeholder="Телефон (+7...)">
            <button onclick="requestVerificationCode()">Продолжить</button>
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО ДЛЯ КОДА -->
    <div id="codeModal" class="modal-overlay hidden">
        <div class="modal">
            <h3>Авторизация</h3>
            <p>Код подтверждения отправлен</p>
            <div id="debugHint" class="debug-hint"></div>
            <input type="text" id="codeInput" class="code-input" maxlength="4" placeholder="----">
            <br>
            <button onclick="verifyCode()" style="width: 100%;">Войти</button>
        </div>
    </div>

    <!-- ОСНОВНОЙ ЭКРАН ЧАТА -->
    <div id="app-screen" class="hidden app-content">
        <div class="sidebar">
            <h4 style="margin: 0 0 10px 0;">Сеть (<span id="currentUserName"></span>)</h4>
            <div class="users-list" id="usersList"></div>
        </div>
        <div class="chat-area">
            <h4 id="chatTitle" style="margin: 0 0 10px 0;">Выбери контакт</h4>
            <div class="messages" id="messagesBox"><i style="color: #45a29e;">Тишина в сети... Выбери с кем пообщаться</i></div>
            <div class="send-panel hidden" id="sendBox">
                <input type="text" id="msgInput" placeholder="Сообщение..." onkeypress="checkEnter(event)">
                <button onclick="sendMessage()">Отправить</button>
            </div>
        </div>
    </div>
</div>

<script>
    let currentUser = '';
    let currentPartner = '';
    let currentPhone = '';
    let dbData = {};

    async function loadData() {
        const res = await fetch('/api/data');
        dbData = await res.json();
        if (currentUser) updateUI();
    }

    async function requestVerificationCode() {
        const name = document.getElementById('nameInput').value.trim();
        const phone = document.getElementById('phoneInput').value.trim();

        if (!name || !phone) {
            alert('Заполни имя и телефон!');
            return;
        }

        const res = await fetch('/api/send-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, phone })
        });
        const data = await res.json();

        if (data.success) {
            currentPhone = phone;
            document.getElementById('debugHint').textContent = `Код для входа: ${data.debugCode}`;
            document.getElementById('codeModal').classList.remove('hidden');
        } else {
            alert('Ошибка отправки кода');
        }
    }

    async function verifyCode() {
        const code = document.getElementById('codeInput').value.trim();
        if (code.length !== 4) {
            alert('Введи 4-значный код!');
            return;
        }

        const res = await fetch('/api/verify-code', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ phone: currentPhone, code })
        });
        const data = await res.json();

        if (data.success) {
            currentUser = data.username;
            dbData = data.db;

            document.getElementById('codeModal').classList.add('hidden');
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('app-screen').classList.remove('hidden');
            document.getElementById('currentUserName').textContent = currentUser;

            updateUI();
            setInterval(loadData, 3000);
        } else {
            alert('Неверный код!');
        }
    }

    function updateUI() {
        const usersListDiv = document.getElementById('usersList');
        usersListDiv.innerHTML = '';

        dbData.users.forEach(user => {
            if (user === currentUser) return;
            const div = document.createElement('div');
            div.className = `user-item ${currentPartner === user ? 'active' : ''}`;
            div.textContent = user;
            div.onclick = () => selectPartner(user);
            usersListDiv.appendChild(div);
        });

        if (currentPartner) renderMessages();
    }

    function selectPartner(user) {
        currentPartner = user;
        document.getElementById('chatTitle').textContent = `Чат с: ${user}`;
        document.getElementById('sendBox').classList.remove('hidden');
        updateUI();
        renderMessages();
    }

    function renderMessages() {
        const messagesBox = document.getElementById('messagesBox');
        messagesBox.innerHTML = '';

        const chatHistory = dbData.messagesStore?.[currentUser]?.[currentPartner] || [];
        
        if (chatHistory.length === 0) {
            messagesBox.innerHTML = '<i style="color:#45a29e;">История пуста. Напиши первым!</i>';
            return;
        }

        chatHistory.forEach(m => {
            const div = document.createElement('div');
            div.className = `msg ${m.sender === currentUser ? 'me' : 'other'}`;
            div.innerHTML = `<b>${m.sender}:</b> ${m.text} <br><small style="font-size:10px; color:#888;">${m.time}</small>`;
            messagesBox.appendChild(div);
        });
        messagesBox.scrollTop = messagesBox.scrollHeight;
    }

    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if (!text || !currentPartner) return;

        const res = await fetch('/api/send-message', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ sender: currentUser, receiver: currentPartner, text })
        });
        const data = await res.json();
        dbData = data.db;
        input.value = '';
        renderMessages();
    }

    function checkEnter(e) {
        if (e.key === 'Enter') sendMessage();
    }
</script>

</body>
</html>
