<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В одно ебало</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #13131a;
            --accent-color: #ff2a5f;
            --accent-hover: #ff0040;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --border-color: #222230;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: var(--panel-bg);
            display: flex;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.15);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        .sidebar {
            width: 350px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: #0e0e12;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
        }

        .my-profile-info {
            padding: 15px 20px;
            background: #111116;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .my-profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .my-profile-actions {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: #1a1a24;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-color), #7b2cbf);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: white;
            font-size: 16px;
            flex-shrink: 0;
            background-size: cover;
            background-position: center;
        }

        .my-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .my-details b {
            color: var(--text-main);
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .my-details span {
            color: var(--text-muted);
            font-size: 12px;
        }

        .add-contact-box {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 8px;
        }

        .add-contact-box input {
            flex: 1;
            padding: 8px 12px;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 6px;
            font-size: 13px;
        }

        .add-contact-box button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-contact-box button:hover {
            background: var(--accent-hover);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .contact-item:hover {
            background: rgba(255, 42, 95, 0.05);
        }

        .contact-item.active {
            background: rgba(255, 42, 95, 0.12);
            border-left: 4px solid var(--accent-color);
        }

        .contact-left {
            display: flex;
            align-items: center;
            gap: 15px;
            overflow: hidden;
        }

        .contact-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
            overflow: hidden;
        }

        .contact-name {
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-status {
            font-size: 12px;
            color: var(--text-muted);
        }

        .contact-status.online {
            color: #00ff88;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
        }

        .chat-header {
            padding: 20px;
            background: #0e0e12;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .chat-header-actions {
            display: flex;
            gap: 8px;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-break: break-word;
        }

        .message.incoming {
            background: #1a1a24;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.outgoing {
            background: var(--accent-color);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.3);
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            text-align: right;
            margin-top: 4px;
        }

        .chat-input-area {
            padding: 20px;
            background: #0e0e12;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input, button {
            outline: none;
            border: none;
            border-radius: 8px;
        }

        .chat-input-area input {
            flex: 1;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .chat-input-area input:focus {
            border-color: var(--accent-color);
        }

        button.send-btn {
            background: var(--accent-color);
            color: white;
            padding: 0 24px;
            height: 45px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.send-btn:hover {
            background: var(--accent-hover);
        }

        button.send-btn:active {
            transform: scale(0.97);
        }

        /* Модальные окна */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 14, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-card {
            background: #13131a;
            border: 1px solid var(--border-color);
            padding: 30px;
            border-radius: 12px;
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 0 40px rgba(255, 42, 95, 0.2);
        }

        .auth-card h2 {
            color: var(--accent-color);
            text-align: center;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 22px;
        }

        .auth-card p {
            color: var(--text-muted);
            font-size: 13px;
            text-align: center;
        }

        .auth-card input[type="text"] {
            width: 100%;
            padding: 12px;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
        }

        .avatar-picker-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .avatar-picker-section label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .presets-grid {
            display: flex;
            gap: 10px;
            justify-content: space-between;
        }

        .preset-av {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            transition: transform 0.2s, border-color 0.2s;
        }

        .preset-av:hover {
            transform: scale(1.05);
        }

        .preset-av.selected {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(255, 42, 95, 0.5);
        }

        .upload-file-label {
            display: block;
            text-align: center;
            padding: 10px;
            background: #1a1a24;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            color: var(--text-muted);
            font-size: 13px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .upload-file-label:hover {
            border-color: var(--accent-color);
            color: var(--text-main);
        }

        .file-avatar-input {
            display: none;
        }

        .auth-card button.main-action-btn {
            width: 100%;
            padding: 12px;
            background: var(--accent-color);
            color: white;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .auth-card button.main-action-btn:hover {
            background: var(--accent-hover);
        }

        .modal-buttons-row {
            display: flex;
            gap: 10px;
        }
    </style>
</head>
<body>

    <!-- Окно авторизации -->
    <div id="authModal" class="modal-overlay">
        <div class="auth-card">
            <h2>В одно ебало</h2>
            <input type="text" id="authName" placeholder="Ваше имя...">
            <input type="text" id="authPhone" placeholder="+7 (___) ___-__-__">
            
            <div class="avatar-picker-section">
                <label>Выберите аватарку:</label>
                <div class="presets-grid" id="presetsGrid">
                    <div class="preset-av selected" style="background: linear-gradient(135deg, #ff2a5f, #7b2cbf);" data-bg="linear-gradient(135deg, #ff2a5f, #7b2cbf)">⚡</div>
                    <div class="preset-av" style="background: linear-gradient(135deg, #00ff88, #00b4d8);" data-bg="linear-gradient(135deg, #00ff88, #00b4d8)">🔥</div>
                    <div class="preset-av" style="background: linear-gradient(135deg, #f72585, #b5179e);" data-bg="linear-gradient(135deg, #f72585, #b5179e)">💀</div>
                    <div class="preset-av" style="background: linear-gradient(135deg, #4361ee, #3a0ca3);" data-bg="linear-gradient(135deg, #4361ee, #3a0ca3)">🚀</div>
                </div>
                <label class="upload-file-label" for="fileAvatarInput">📁 Загрузить свою картинку</label>
                <input type="file" id="fileAvatarInput" class="file-avatar-input" accept="image/*">
            </div>

            <button id="authBtn" class="main-action-btn">ПРОДОЛЖИТЬ</button>
        </div>
    </div>

    <!-- Окно подтверждения по коду -->
    <div id="codeModal" class="modal-overlay" style="display: none;">
        <div class="auth-card">
            <h2>Код подтверждения</h2>
            <p>Введите код, пришедший в консоль сервера (или тестовый код)</p>
            <input type="text" id="codeCodeInput" placeholder="Код из консоли...">
            <button id="codeBtn" class="main-action-btn">ПОДТВЕРДИТЬ</button>
        </div>
    </div>

    <!-- Окно настроек профиля -->
    <div id="settingsModal" class="modal-overlay" style="display: none;">
        <div class="auth-card">
            <h2>Редактировать профиль</h2>
            <input type="text" id="settingsName" placeholder="Ваше имя...">
            
            <div class="avatar-picker-section">
                <label>Сменить аватарку:</label>
                <div class="presets-grid" id="settingsPresetsGrid">
                    <div class="preset-av" style="background: linear-gradient(135deg, #ff2a5f, #7b2cbf);" data-bg="linear-gradient(135deg, #ff2a5f, #7b2cbf)">⚡</div>
                    <div class="preset-av" style="background: linear-gradient(135deg, #00ff88, #00b4d8);" data-bg="linear-gradient(135deg, #00ff88, #00b4d8)">🔥</div>
                    <div class="preset-av" style="background: linear-gradient(135deg, #f72585, #b5179e);" data-bg="linear-gradient(135deg, #f72585, #b5179e)">💀</div>
                    <div class="preset-av" style="background: linear-gradient(135deg, #4361ee, #3a0ca3);" data-bg="linear-gradient(135deg, #4361ee, #3a0ca3)">🚀</div>
                </div>
                <label class="upload-file-label" for="settingsFileAvatarInput">📁 Загрузить свою картинку</label>
                <input type="file" id="settingsFileAvatarInput" class="file-avatar-input" accept="image/*">
            </div>

            <div class="modal-buttons-row">
                <button id="saveSettingsBtn" class="main-action-btn">СОХРАНИТЬ</button>
                <button id="closeSettingsBtn" class="main-action-btn" style="background: #222230;">ОТМЕНА</button>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Левая колонка -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>⚡ В одно ебало</span>
            </div>
            
            <!-- Профиль пользователя с кнопками управления -->
            <div class="my-profile-info" id="myProfileInfo">
                <div class="my-profile-left">
                    <div class="avatar" id="myAvatar">Я</div>
                    <div class="my-details">
                        <b id="myNameDisplay">Имя</b>
                        <span id="myPhoneDisplay">+7XXXXXXXXXX</span>
                    </div>
                </div>
                <div class="my-profile-actions">
                    <button class="icon-btn" id="profileSettingsBtn" title="Настройки">⚙️</button>
                    <button class="icon-btn" id="logoutBtn" title="Выйти">🚪</button>
                </div>
            </div>

            <div class="add-contact-box">
                <input type="text" id="targetPhoneInput" placeholder="+7 (___) ___-__-__">
                <button id="addContactBtn">+</button>
            </div>
            <div class="contacts-list" id="contactsList">
                <!-- Контакты будут здесь -->
            </div>
        </div>

        <!-- Правая колонка (Чат) -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">
                <div class="chat-header-left">
                    <div class="avatar" id="activeAvatar" style="display: none; width: 32px; height: 32px; font-size: 14px;">?</div>
                    <span id="chatHeaderText">Выберите чат слева</span>
                </div>
                <div class="chat-header-actions" id="chatHeaderActions" style="display: none;">
                    <button class="icon-btn" id="clearChatBtn" title="Очистить чат">🧹</button>
                    <button class="icon-btn" id="blockContactBtn" title="Заблокировать">🚫</button>
                </div>
            </div>
            <div class="messages-container" id="messagesContainer">
                <div style="color: var(--text-muted); text-align: center; margin-top: auto; margin-bottom: auto;">Выберите контакт для общения</div>
            </div>
            <div class="chat-input-area" id="inputArea" style="display: none;">
                <button class="icon-btn" id="attachFileBtn" title="Прикрепить файл">📎</button>
                <input type="text" id="messageInput" placeholder="Написать сообщение...">
                <button class="send-btn" id="sendBtn">SEND</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        let myPhone = localStorage.getItem('chat_phone') || '';
        let myName = localStorage.getItem('chat_name') || '';
        let myAvatarData = localStorage.getItem('chat_avatar') || 'linear-gradient(135deg, #ff2a5f, #7b2cbf)';
        let activeContactPhone = null;
        let allMessages = {};
        let contacts = [];

        // Выбор аватарки в модалке входа
        let selectedAvatarStyle = myAvatarData;
        const presetAvs = document.querySelectorAll('#presetsGrid .preset-av');
        presetAvs.forEach(av => {
            if (av.dataset.bg === myAvatarData) {
                presetAvs.forEach(p => p.classList.remove('selected'));
                av.classList.add('selected');
            }
            av.addEventListener('click', () => {
                presetAvs.forEach(p => p.classList.remove('selected'));
                av.classList.add('selected');
                selectedAvatarStyle = av.dataset.bg;
            });
        });

        document.getElementById('fileAvatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    selectedAvatarStyle = `url(${event.target.result})`;
                    presetAvs.forEach(p => p.classList.remove('selected'));
                };
                reader.readAsDataURL(file);
            }
        });

        // Открытие настроек профиля из блока профиля
        let settingsAvatarStyle = myAvatarData;
        const settingsPresetAvs = document.querySelectorAll('#settingsPresetsGrid .preset-av');
        
        function openSettingsModal() {
            document.getElementById('settingsName').value = myName;
            settingsAvatarStyle = myAvatarData;
            settingsPresetAvs.forEach(av => {
                if (av.dataset.bg === myAvatarData) {
                    av.classList.add('selected');
                } else {
                    av.classList.remove('selected');
                }
            });
            document.getElementById('settingsModal').style.display = 'flex';
        }

        document.getElementById('profileSettingsBtn').addEventListener('click', openSettingsModal);

        settingsPresetAvs.forEach(av => {
            av.addEventListener('click', () => {
                settingsPresetAvs.forEach(p => p.classList.remove('selected'));
                av.classList.add('selected');
                settingsAvatarStyle = av.dataset.bg;
            });
        });

        document.getElementById('settingsFileAvatarInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    settingsAvatarStyle = `url(${event.target.result})`;
                    settingsPresetAvs.forEach(p => p.classList.remove('selected'));
                };
                reader.readAsDataURL(file);
            }
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').style.display = 'none';
        });

        document.getElementById('saveSettingsBtn').addEventListener('click', () => {
            const newName = document.getElementById('settingsName').value.trim();
            if (!newName) {
                alert('Имя не может быть пустым!');
                return;
            }
            myName = newName;
            myAvatarData = settingsAvatarStyle;
            localStorage.setItem('chat_name', myName);
            localStorage.setItem('chat_avatar', myAvatarData);
            
            document.getElementById('settingsModal').style.display = 'none';
            loginUser(myName, myPhone, myAvatarData);
        });

        // Кнопка выхода (Logout)
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('chat_phone');
                localStorage.removeItem('chat_name');
                localStorage.removeItem('chat_avatar');
                location.reload();
            }
        });

        // Дополнительные кнопки в чате (очистка, блокировка, прикрепление)
        document.getElementById('clearChatBtn').addEventListener('click', () => {
            if (activeContactPhone && confirm('Очистить историю этого чата?')) {
                const chatKey = [myPhone, activeContactPhone].sort().join('_');
                allMessages[chatKey] = [];
                renderMessages();
            }
        });

        document.getElementById('blockContactBtn').addEventListener('click', () => {
            if (activeContactPhone) {
                alert('Контакт заблокирован.');
            }
        });

        document.getElementById('attachFileBtn').addEventListener('click', () => {
            alert('Функция прикрепления файлов в разработке.');
        });

        // Маска телефона (+7 (XXX) XXX-XX-XX)
        function setupPhoneMask(input) {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, '');
                if (value.startsWith('8') || value.startsWith('7')) {
                    value = value.substring(1);
                }
                
                let result = '+7';
                if (value.length > 0) result += ' (' + value.substring(0, 3);
                if (value.length >= 4) result += ') ' + value.substring(3, 6);
                if (value.length >= 7) result += '-' + value.substring(6, 8);
                if (value.length >= 9) result += '-' + value.substring(8, 10);

                e.target.value = result;
            });

            input.addEventListener('focus', (e) => {
                if (!e.target.value) {
                    e.target.value = '+7 (';
                }
            });

            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && e.target.value.length <= 4) {
                    e.target.value = '';
                }
            });
        }

        setupPhoneMask(document.getElementById('authPhone'));
        setupPhoneMask(document.getElementById('targetPhoneInput'));

        const authModal = document.getElementById('authModal');
        const codeModal = document.getElementById('codeModal');
        const authNameInput = document.getElementById('authName');
        const authPhoneInput = document.getElementById('authPhone');
        const authBtn = document.getElementById('authBtn');
        const codeCodeInput = document.getElementById('codeCodeInput');
        const codeBtn = document.getElementById('codeBtn');

        let tempName = '';
        let tempPhone = '';

        if (myPhone && myName) {
            authModal.style.display = 'none';
            loginUser(myName, myPhone, myAvatarData);
        }

        authBtn.addEventListener('click', () => {
            tempName = authNameInput.value.trim();
            tempPhone = authPhoneInput.value.trim();
            
            if (!tempName || tempPhone.length < 18) {
                alert('Заполните имя и корректный номер телефона!');
                return;
            }
            
            myAvatarData = selectedAvatarStyle; // Сохраняем выбранную аватарку во временную переменную
            socket.emit('request_code', { phone: tempPhone });
            authModal.style.display = 'none';
            codeModal.style.display = 'flex';
        });

        codeBtn.addEventListener('click', () => {
            const code = codeCodeInput.value.trim();
            if (!code) {
                alert('Введите код!');
                return;
            }
            socket.emit('verify_code', { name: tempName, phone: tempPhone, code: code });
        });

        socket.on('verification_result', (res) => {
            if (res.success) {
                myPhone = tempPhone;
                myName = tempName;
                localStorage.setItem('chat_name', myName);
                localStorage.setItem('chat_phone', myPhone);
                localStorage.setItem('chat_avatar', myAvatarData); // Сохраняем в localStorage
                codeModal.style.display = 'none';
                loginUser(myName, myPhone, myAvatarData);
            } else {
                alert(res.message || 'Неверный код!');
            }
        });

        function loginUser(name, phone, avatar) {
            document.getElementById('myNameDisplay').innerText = name;
            document.getElementById('myPhoneDisplay').innerText = phone;
            
            const myAvatarEl = document.getElementById('myAvatar');
            if (avatar.startsWith('url(')) {
                myAvatarEl.style.background = avatar;
                myAvatarEl.innerText = '';
            } else {
                myAvatarEl.style.background = avatar;
                myAvatarEl.innerText = name.charAt(0).toUpperCase();
            }
            
            socket.emit('verify_code', { name, phone, code: '0000' });
        }

        document.getElementById('addContactBtn').addEventListener('click', () => {
            const targetPhone = document.getElementById('targetPhoneInput').value.trim();
            if (targetPhone.length < 18) {
                alert('Введите полный номер телефона контакта!');
                return;
            }
            socket.emit('add_contact', { myPhone, targetPhone });
            document.getElementById('targetPhoneInput').value = '';
        });

        socket.on('add_contact_response', (res) => {
            alert(res.message);
        });

        socket.on('contacts_list', (list) => {
            contacts = list;
            renderContacts();
        });

        function renderContacts() {
            const listEl = document.getElementById('contactsList');
            listEl.innerHTML = '';
            contacts.forEach(c => {
                const item = document.createElement('div');
                item.className = `contact-item ${activeContactPhone === c.phone ? 'active' : ''}`;
                const initial = c.name ? c.name.charAt(0).toUpperCase() : '?';
                item.innerHTML = `
                    <div class="contact-left">
                        <div class="avatar" style="width: 36px; height: 36px; font-size: 14px;">${initial}</div>
                        <div class="contact-info">
                            <div class="contact-name">${c.name}</div>
                            <div class="contact-status ${c.isOnline ? 'online' : ''}">
                                ${c.isOnline ? '● в сети' : (c.lastSeen ? 'был в ' + c.lastSeen : 'не в сети')}
                            </div>
                        </div>
                    </div>
                `;
                item.onclick = () => selectContact(c);
                listEl.appendChild(item);
            });
        }

        function selectContact(contact) {
            activeContactPhone = contact.phone;
            
            const activeAvatar = document.getElementById('activeAvatar');
            activeAvatar.style.display = 'flex';
            activeAvatar.innerText = contact.name.charAt(0).toUpperCase();
            document.getElementById('chatHeaderText').innerText = contact.name;
            
            document.getElementById('chatHeaderActions').style.display = 'flex';
            document.getElementById('inputArea').style.display = 'flex';
            renderContacts();
            renderMessages();
        }

        socket.on('all_messages', (messages) => {
            allMessages = messages;
            renderMessages();
        });

        socket.on('message', (msg) => {
            const chatKey = [msg.fromPhone, myPhone].sort().join('_');
            if (!allMessages[chatKey]) allMessages[chatKey] = [];
            allMessages[chatKey].push({
                fromPhone: msg.fromPhone,
                text: msg.text,
                time: msg.time
            });
            renderMessages();
        });

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeContactPhone) return;

            socket.emit('private_message', {
                toPhone: activeContactPhone,
                message: text
            });

            const chatKey = [myPhone, activeContactPhone].sort().join('_');
            if (!allMessages[chatKey]) allMessages[chatKey] = [];
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            allMessages[chatKey].push({
                fromPhone: myPhone,
                text: text,
                time: time
            });

            input.value = '';
            renderMessages();
        }

        function renderMessages() {
            if (!activeContactPhone) return;
            const container = document.getElementById('messagesContainer');
            container.innerHTML = '';

            const chatKey = [myPhone, activeContactPhone].sort().join('_');
            const messages = allMessages[chatKey] || [];

            if (messages.length === 0) {
                container.innerHTML = '<div style="color: var(--text-muted); text-align: center; margin: auto;">Нет сообщений. Напишите первыми!</div>';
                return;
            }

            messages.forEach(m => {
                const msgEl = document.createElement('div');
                const isOutgoing = m.fromPhone === myPhone;
                msgEl.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
                msgEl.innerHTML = `
                    <div>${m.text}</div>
                    <div class="message-time">${m.time || ''}</div>
                `;
                container.appendChild(msgEl);
            });
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
