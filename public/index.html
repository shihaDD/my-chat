<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Веб-чат</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        #auth-screen {
            background: white;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            width: 340px;
            text-align: center;
        }
        #auth-screen h2 { margin-bottom: 8px; color: #333; }
        #auth-screen p { font-size: 13px; color: #666; margin-bottom: 20px; }
        #auth-screen input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        #auth-screen button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
        }
        #auth-screen button:hover { background: #0056b3; }

        #chat-screen {
            display: none;
            width: 900px;
            height: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
            overflow: hidden;
            display: none;
            grid-template-columns: 260px 1fr;
        }
        .sidebar { background: #f8f9fa; border-right: 1px solid #dee2e6; display: flex; flex-direction: column; }
        .sidebar-header { padding: 20px; font-weight: bold; border-bottom: 1px solid #dee2e6; background: #fff; }
        #users-list { list-style: none; overflow-y: auto; flex: 1; }
        #users-list li { padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #f1f3f5; transition: background 0.2s; }
        #users-list li:hover { background: #e9ecef; }
        #users-list li.active { background: #007bff; color: white; }

        .chat-area { display: flex; flex-direction: column; height: 100%; }
        .chat-header { padding: 20px; border-bottom: 1px solid #dee2e6; font-weight: bold; background: #fff; }
        .messages-container { flex: 1; padding: 20px; overflow-y: auto; background: #fdfdfe; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 70%; padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; word-break: break-word; }
        .message.incoming { background: #e9ecef; align-self: flex-start; }
        .message.outgoing { background: #007bff; color: white; align-self: flex-end; }
        .message .time { font-size: 10px; opacity: 0.7; margin-top: 4px; text-align: right; }

        .chat-input-area { padding: 15px; border-top: 1px solid #dee2e6; display: flex; gap: 10px; background: #fff; }
        .chat-input-area input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .chat-input-area button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <h2>Вход в чат</h2>
        <p>Введите ваш никнейм для подключения</p>
        <input type="text" id="username-input" placeholder="Ваше имя..." autocomplete="off">
        <button id="login-btn">Войти</button>
    </div>

    <div id="chat-screen">
        <div class="sidebar">
            <div class="sidebar-header">Пользователи</div>
            <ul id="users-list"></ul>
        </div>
        <div class="chat-area">
            <div class="chat-header" id="active-chat-title">Выберите чат слева</div>
            <div class="messages-container" id="messages"></div>
            <div class="chat-input-area" id="input-area" style="display: none;">
                <input type="text" id="message-input" placeholder="Введите сообщение..." autocomplete="off">
                <button id="send-btn">Отправить</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';
        let activeRecipient = null;
        const messagesStore = {};

        const authScreen = document.getElementById('auth-screen');
        const chatScreen = document.getElementById('chat-screen');
        const usernameInput = document.getElementById('username-input');
        const loginBtn = document.getElementById('login-btn');
        const usersList = document.getElementById('users-list');
        const activeChatTitle = document.getElementById('active-chat-title');
        const messagesContainer = document.getElementById('messages');
        const inputArea = document.getElementById('input-area');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');

        loginBtn.onclick = () => {
            const name = usernameInput.value.trim();
            if (!name) return alert('Введите имя!');
            socket.emit('register', name, (response) => {
                if (response.success) {
                    myUsername = response.username;
                    authScreen.style.display = 'none';
                    chatScreen.style.display = 'grid';
                } else {
                    alert(response.message);
                }
            });
        };

        socket.on('users_list', (users) => {
            usersList.innerHTML = '';
            users.forEach(user => {
                if (user === myUsername) return;
                const li = document.createElement('li');
                li.textContent = user;
                if (user === activeRecipient) li.classList.add('active');
                li.onclick = () => {
                    activeRecipient = user;
                    activeChatTitle.textContent = `Чат с: ${user}`;
                    inputArea.style.display = 'flex';
                    document.querySelectorAll('#users-list li').forEach(el => el.classList.remove('active'));
                    li.classList.add('active');
                    renderMessages();
                };
                usersList.appendChild(li);
            });
        });

        socket.on('message', (data) => {
            if (!messagesStore[data.from]) messagesStore[data.from] = [];
            messagesStore[data.from].push({ text: data.text, time: data.time, incoming: true });
            if (activeRecipient === data.from) renderMessages();
        });

        sendBtn.onclick = sendMessage;
        messageInput.onkeydown = (e) => { if (e.key === 'Enter') sendMessage(); };

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !activeRecipient) return;

            if (!messagesStore[activeRecipient]) messagesStore[activeRecipient] = [];
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            messagesStore[activeRecipient].push({ text, time, incoming: false });

            socket.emit('private_message', { to: activeRecipient, message: text });
            messageInput.value = '';
            renderMessages();
        }

        function renderMessages() {
            messagesContainer.innerHTML = '';
            const msgs = messagesStore[activeRecipient] || [];
            msgs.forEach(m => {
                const div = document.createElement('div');
                div.className = `message ${m.incoming ? 'incoming' : 'outgoing'}`;
                div.innerHTML = `<div>${escapeHtml(m.text)}</div><div class="time">${m.time}</div>`;
                messagesContainer.appendChild(div);
            });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
