<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>В одно ебало</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --panel-bg: #13131a;
            --accent-color: #ff2a5f; /* Дерзкий неоново-розовый / красный */
            --accent-hover: #ff0040;
            --text-main: #f0f0f5;
            --text-muted: #8a8a9e;
            --border-color: #222230;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: var(--panel-bg);
            display: flex;
            box-shadow: 0 0 30px rgba(255, 42, 95, 0.15);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* Левая панель (Контакты / Меню) */
        .sidebar {
            width: 350px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: #0e0e12;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent-color);
            letter-spacing: 1px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-header span {
            font-size: 24px;
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
        }

        .contact-item:hover {
            background: rgba(255, 42, 95, 0.05);
        }

        .contact-item.active {
            background: rgba(255, 42, 95, 0.12);
            border-left: 4px solid var(--accent-color);
        }

        /* Правая панель (Чат) */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--panel-bg);
        }

        .chat-header {
            padding: 20px;
            background: #0e0e12;
            border-bottom: 1px solid var(--border-color);
            font-weight: 700;
            font-size: 16px;
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
        }

        .message.incoming {
            background: #1a1a24;
            color: var(--text-main);
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .message.outgoing {
            background: var(--accent-color);
            color: #fff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            box-shadow: 0 4px 15px rgba(255, 42, 95, 0.3);
        }

        /* Поле ввода */
        .chat-input-area {
            padding: 20px;
            background: #0e0e12;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }

        input, button {
            outline: none;
            border: none;
            border-radius: 8px;
        }

        input {
            flex: 1;
            background: #1a1a24;
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            color: var(--text-main);
            font-size: 14px;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--accent-color);
        }

        button.send-btn {
            background: var(--accent-color);
            color: white;
            padding: 0 24px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button.send-btn:hover {
            background: var(--accent-hover);
        }

        button.send-btn:active {
            transform: scale(0.97);
        }

        /* Адаптив для мобилок */
        @media (max-width: 768px) {
            .sidebar {
                width: 100%;
            }
            .app-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Левая колонка -->
        <div class="sidebar">
            <div class="sidebar-header">
                <span>⚡</span> В одно ебало
            </div>
            <div class="contacts-list" id="contactsList">
                <!-- Сюда динамически подгружаются контакты -->
            </div>
        </div>

        <!-- Правая колонка (Чат) -->
        <div class="chat-area">
            <div class="chat-header" id="chatHeader">Выберите чат</div>
            <div class="messages-container" id="messagesContainer">
                <!-- История сообщений -->
            </div>
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="Написать сообщение...">
                <button class="send-btn" id="sendBtn">SEND</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        // Здесь подключается ваш клиентский скрипт для работы с Socket.IO
        const socket = io();
        // Пример базового функционала можно связать с вашими существующими обработчиками
    </script>
</body>
</html>
